- name: rpt_public_concentration
  description: 'PUBLIC model (docs/publication_policy.md): concentration of Scope 1+2 emissions, one row
    per company and financial year with emissions. Rank by emissions, share of the emissions of all companies
    covered that year, cumulative share and top-5 / top-10 flags (the Pareto table of Week 10 Q2). Shares
    and ranks only: no tonnes, no total.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - fiscal_year_label
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - fiscal_year_label
        - emitter_rank
  columns:
  - name: isin
    description: ISIN of the company (key of dim_company).
    tests: [not_null]
  - name: symbol
    description: NSE symbol in the filing.
  - name: display_name
    description: Short company name for charts.
  - name: fiscal_year_label
    description: Financial year, e.g. FY2025-26.
    tests: [not_null]
  - name: sector_group
    description: Financials, Asset-light or Asset-heavy.
  - name: peer_group
    description: Peer group (seed peer_groups).
  - name: ranking_group
    description: Group the company is ranked in.
  - name: emitter_rank
    description: Rank by Scope 1+2 emissions within the year, 1 = largest emitter (ties broken by ISIN).
    tests: [not_null]
  - name: n_companies_in_year
    description: Companies with Scope 1+2 emissions that year (the base of the shares).
  - name: share_of_total_pct
    description: Share of the Scope 1+2 emissions of all companies covered that year, in % (0-100).
    tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 100
  - name: cumulative_share_pct
    description: Share held by this company and every larger emitter together, in % (0-100).
    tests:
    - not_null
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 100.000001
  - name: is_top_5
    description: true for the five largest emitters of the year.
  - name: is_top_10
    description: true for the ten largest emitters of the year.
- name: rpt_public_company_percentile
  description: 'PUBLIC model (docs/publication_policy.md): position of each company in its ranking group,
    per KPI and financial year, from fct_company_kpi_percentile (rows with a value only). Percentile (100
    = best), rank (1 = best), companies in the group, ranked or not and why. The KPI value itself only for
    KPIs that kpi_catalogue marks public_safe (values we compute); filed values stay empty.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - fiscal_year_label
        - kpi_name
  columns:
  - name: isin
    description: ISIN of the company (key of dim_company).
    tests: [not_null]
  - name: display_name
    description: Short company name for charts.
  - name: fiscal_year_label
    description: Financial year, e.g. FY2025-26.
    tests: [not_null]
  - name: kpi_name
    description: KPI column of fct_company_year (kpi_catalogue.kpi_name).
    tests: [not_null]
  - name: kpi_label
    description: Plain label of the KPI (kpi_catalogue).
  - name: kpi_unit
    description: Unit of the KPI (kpi_catalogue).
  - name: direction
    description: lower_better or higher_better (what "best" means for the rank).
  - name: peer_group
    description: Peer group (seed peer_groups).
  - name: sector_group
    description: Financials, Asset-light or Asset-heavy.
  - name: ranking_group
    description: Group the company is ranked in (its peer group, or its sector group when the peer group is small).
  - name: percentile_in_group
    description: 0-100, 100 = best in the ranking group and year; empty when not ranked.
  - name: rank_in_group
    description: 1 = best in the ranking group and year; ties share the better rank; empty when not ranked.
  - name: n_in_group
    description: Companies of the ranking group with a rankable value of the KPI that year.
  - name: is_ranked
    description: true when a percentile is given (5 or more companies with a value, KPI material for the group).
    tests: [not_null]
  - name: reason_not_ranked
    description: 'Why there is no percentile: not_material, group_n_lt_5, flagged_value, no_direction or
      no_group. Empty when ranked.'
    tests:
    - accepted_values:
        arguments:
          values: [not_material, group_n_lt_5, flagged_value, no_direction, no_group, no_value]
  - name: kpi_value_public
    description: The KPI value, only when kpi_catalogue marks the KPI public_safe (a value we compute); empty for filed values.

- name: rpt_public_ghg_yoy
  description: 'PUBLIC model (docs/publication_policy.md): year-on-year change of the GHG intensity we compute
    (Scope 1+2 per Rs crore) for consecutive years of a company in a ranking group where GHG intensity is
    material, with a confidence label. Only confirmed pairs in a group with 5 or more comparable companies
    are ranked. The Week 10 Q3 result, built in dbt.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - to_year
  columns:
  - name: isin
    description: ISIN of the company (key of dim_company).
    tests: [not_null]
  - name: ranking_group
    description: Group the company is ranked in.
  - name: display_name
    description: Short company name for charts.
  - name: from_year
    description: Earlier financial year of the pair.
  - name: to_year
    description: Later financial year of the pair (the next one).
  - name: intensity_from
    description: Computed GHG intensity in from_year, tCO2e per Rs crore (2 decimals).
  - name: intensity_to
    description: Computed GHG intensity in to_year, tCO2e per Rs crore (2 decimals).
  - name: change_pct
    description: Change from from_year to to_year in % (1 decimal).
  - name: confidence
    description: How far the pair can be trusted; only confirmed pairs are ranked.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values: [confirmed, provisional, inferred_unit, restated_later, one_year_reversal, not_confirmed]
  - name: n_companies_compared
    description: Pairs in the ranking group ending in the same year.
  - name: is_ranked
    description: true for a confirmed pair in a group with 5 or more comparable companies.
    tests: [not_null]
  - name: improvement_rank_in_group
    description: 1 = largest confirmed improvement in the ranking group; empty when not ranked.
  - name: deterioration_rank_in_group
    description: 1 = largest confirmed deterioration in the ranking group; empty when not ranked.
  - name: improvement_rank_overall
    description: 1 = largest confirmed improvement of all ranked pairs.
  - name: deterioration_rank_overall
    description: 1 = largest confirmed deterioration of all ranked pairs.
unit_tests:
- name: test_dqs_perfect_company
  description: Everything filed, every check passed, whole report assured = 100, grade A, no reason code.
  model: fct_disclosure_quality
  given:
  - input: ref('int_dqs_components')
    rows:
    - {isin: PERFECT, fiscal_year_label: FY2024-25, ranking_group: G, completeness: 1, mandatory_completeness: 1, voluntary_depth: 1, internal_consistency: 1, temporal_consistency: 1, assurance: 1, assurance_level: reasonable, assurance_scope: all, n_applicable_checks: 6, n_failed_waste_balance_gap: 0, n_failed_waste_recovery_over_100: 0, n_failed_implausible_zero: 0, n_failed_unit_inconsistency: 0, n_comparable_metrics: 20, n_metrics_scale_error: 0, n_metrics_material_restatement: 0, n_metrics_yoy_anomaly: 0}
  - input: ref('dqs_weights')
    rows:
    - {component: completeness, weight: 0.30}
    - {component: internal_consistency, weight: 0.30}
    - {component: temporal_consistency, weight: 0.20}
    - {component: assurance, weight: 0.20}
  expect:
    rows:
    - {isin: PERFECT, dqs_total: 100, dqs_grade: A, dqs_components_used: 4, is_provisional: false, dqs_group_n: 1, dqs_rank_in_group: null, dqs_reason_codes: null}
- name: test_dqs_no_assurance_only
  description: Perfect except no assurance loses exactly the assurance weight (100 - 20 = 80, grade B).
  model: fct_disclosure_quality
  given:
  - input: ref('int_dqs_components')
    rows:
    - {isin: NOASSURE, fiscal_year_label: FY2024-25, ranking_group: G, completeness: 1, mandatory_completeness: 1, voluntary_depth: 1, internal_consistency: 1, temporal_consistency: 1, assurance: 0, assurance_level: not_disclosed, n_applicable_checks: 6, n_failed_waste_balance_gap: 0, n_failed_waste_recovery_over_100: 0, n_failed_implausible_zero: 0, n_failed_unit_inconsistency: 0, n_comparable_metrics: 20, n_metrics_scale_error: 0, n_metrics_material_restatement: 0, n_metrics_yoy_anomaly: 0}
  - input: ref('dqs_weights')
    rows:
    - {component: completeness, weight: 0.30}
    - {component: internal_consistency, weight: 0.30}
    - {component: temporal_consistency, weight: 0.20}
    - {component: assurance, weight: 0.20}
  expect:
    rows:
    - {isin: NOASSURE, dqs_total: 80, dqs_grade: B, dqs_components_used: 4, dqs_reason_codes: no_assurance}
- name: test_dqs_latest_year_reweights
  description: >
    Latest year, no temporal check: the other three weights are re-normalised over 0.8 and the
    score is provisional. All required metrics filed but 6 in 10 Leadership indicators
    (completeness 0.8), Core assurance only (0.5):
    (0.30 x 0.8 + 0.30 x 1 + 0.20 x 0.5) / 0.80 = 80.0 (grade B);
    with all four weights and a zero for the missing check it would have been 64.
  model: fct_disclosure_quality
  given:
  - input: ref('int_dqs_components')
    rows:
    - {isin: LATEST, fiscal_year_label: FY2025-26, ranking_group: G, completeness: 0.8, mandatory_completeness: 1, voluntary_depth: 0.6, internal_consistency: 1, temporal_consistency: null, assurance: 0.5, assurance_level: reasonable, assurance_scope: partial, n_applicable_checks: 6, n_failed_waste_balance_gap: 0, n_failed_waste_recovery_over_100: 0, n_failed_implausible_zero: 0, n_failed_unit_inconsistency: 0}
  - input: ref('dqs_weights')
    rows:
    - {component: completeness, weight: 0.30}
    - {component: internal_consistency, weight: 0.30}
    - {component: temporal_consistency, weight: 0.20}
    - {component: assurance, weight: 0.20}
  expect:
    rows:
    - {isin: LATEST, dqs_total: 80, dqs_grade: B, dqs_components_used: 3, is_provisional: true, dqs_temporal_consistency: null, dqs_reason_codes: assurance_core_only|low_voluntary_disclosure}
- name: test_dqs_insufficient_data
  description: >
    Only two components (no later filing, no assurance field): the total is shown but there is
    no grade and no rank, even in a group of five.
  model: fct_disclosure_quality
  given:
  - input: ref('int_dqs_components')
    rows:
