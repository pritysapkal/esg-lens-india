  - name: business_group
    description: Business group or Independent.
  - name: reporting_boundary
    description: standalone or consolidated.
  - name: brsr_core_assurance_status
    description: assured, assessed or not disclosed.
  - name: assurance_type
    description: 'Scope of the BRSR Core assurance: All or Partial.'
  - name: has_comparability_break
    description: true if an event or boundary change breaks comparability with the previous year.
  - name: comparability_break_reason
    description: merger, demerger, boundary change or combined.
  - name: period_months
    description: Length of the reporting period in months.
  - name: annualisation_factor
    description: 12 / period_months.
  - name: female_workforce_pct
    description: headcount_female / headcount_total x 100.
  - name: female_wage_share_pct
    description: Share of gross wages paid to women, as filed (BRSR Core).
  - name: pay_equity_gap_pp
    description: female_wage_share_pct - female_workforce_pct, in percentage points; negative = women
      get a smaller share of wages than of headcount.
  - name: female_board_pct
    description: Share of women on the board, as filed.
  - name: attrition_female_pct
    description: Attrition rate of permanent female employees, as filed.
  - name: attrition_male_pct
    description: Attrition rate of permanent male employees, as filed.
  - name: attrition_gap_pp
    description: attrition_female_pct - attrition_male_pct, in percentage points.
  - name: scope3_disclosed
    description: true if a Scope 3 value is filed.
  - name: ghg_intensity_tco2e_per_cr
    description: ghg_s12_tco2e / turnover_cr (computed by us).
  - name: ghg_intensity_filed_per_cr
    description: Scope 1+2 intensity as the company filed it.
  - name: ghg_intensity_filed_vs_computed_ratio
    description: Filed / computed intensity; near 1 when consistent.
  - name: ghg_intensity_filed_basis
    description: 'Denominator the company used for its filed GHG intensity: per rupee (as required), per
      lakh, per million, per crore or other/unclear.'
  - name: renewable_share_pct
    description: energy_renewable_gj / energy_total_gj x 100.
  - name: energy_intensity_gj_per_cr
    description: energy_total_gj / turnover_cr (computed).
  - name: energy_intensity_filed_gj_per_cr
    description: Energy intensity as filed.
  - name: energy_intensity_filed_vs_computed_ratio
    description: Filed / computed energy intensity.
  - name: energy_intensity_filed_basis
    description: Denominator used for the filed energy intensity.
  - name: water_intensity_kl_per_cr
    description: water_consumption_kl / turnover_cr (computed).
  - name: water_intensity_filed_kl_per_cr
    description: Water intensity as filed.
  - name: water_intensity_filed_vs_computed_ratio
    description: Filed / computed water intensity.
  - name: water_intensity_filed_basis
    description: Denominator used for the filed water intensity.
  - name: waste_recovery_rate_pct
    description: waste_recovered_t / waste_generated_t x 100.
  - name: waste_intensity_t_per_cr
    description: waste_generated_t / turnover_cr.
  - name: waste_balance_gap_pct
    description: (generated - recovered - disposed) / generated x 100; far from 0 means inconsistent inputs.
  - name: ltifr_employees
    description: Lost time injury frequency rate, employees (per million hours).
  - name: ltifr_workers
    description: Lost time injury frequency rate, workers (per million hours).
  - name: any_fatality
    description: true if fatalities_total > 0.
  - name: fatalities_per_10k_workforce
    description: fatalities_total / headcount_total x 10,000.
  - name: posh_complaints_pct_female
    description: POSH complaints as % of female employees and workers, as filed.
  - name: wellbeing_cost_pct_revenue
    description: Well-being spend as % of revenue, as filed.
  - name: msme_sourcing_pct
    description: Input sourced directly from MSMEs / small producers, %.
  - name: days_payable
    description: Days of accounts payable; empty for Financials.
  - name: rpt_purchases_pct
    description: Purchases from related parties, % of purchases.
  - name: rpt_sales_pct
    description: Sales to related parties, % of sales.
  - name: any_data_breach
    description: true if the number of data breaches > 0.
  - name: n_values_replaced
    description: Current-year values of this company-year replaced by the later comparative (suspected
      scale errors).
  - name: kpi_flags
    description: 'Pipe-separated flags: implausible zeros set to empty, waste recovery above 100%, values
      replaced. Empty if none.'
- name: rpt_public_restatement_summary
  description: 'PUBLIC model (docs/publication_policy.md): only values we calculate, no raw filed quantity.
    Restatement classifications, counts and percentages by level; no original or restated value.'
