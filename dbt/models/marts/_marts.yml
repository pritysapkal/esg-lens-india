- name: fct_disclosure_quality
  description: 'Disclosure Quality Score (v2) per company and financial year: total (0-100), the component
    scores (0-1), grade, rank and percentile within the ranking group and year, and the reasons for lost
    points. It measures the quality of disclosure, not ESG performance. Every column is calculated by us.
    Method: docs/disclosure_quality_score.md.'
  config:
    contract:
      enforced: true
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - fiscal_year_label
  - dbt_utils.equal_rowcount:
      arguments:
        compare_model: ref('dim_company_year')
  columns:
  - name: isin
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: ISIN of the company (key of dim_company).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_company')
          field: isin
  - name: fiscal_year_label
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Financial year, e.g. FY2025-26.
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_fiscal_year')
          field: fiscal_year_label
  - name: symbol
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: NSE symbol in the filing.
  - name: display_name
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Short company name for charts.
  - name: peer_group
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Peer group (seed peer_groups).
  - name: sector_group
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Financials, Asset-light or Asset-heavy.
  - name: ranking_group
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Group the company is ranked in.
  - name: dqs_total
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: Disclosure Quality Score, 0-100, one decimal; empty if fewer than two components could be scored. Compare only within a financial year.
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 100
    - not_null:
        config:
          where: dqs_components_used >= 2
  - name: dqs_grade
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: A (85 and above), B (70 to below 85), C (55 to below 70), D (below 55); insufficient_data when fewer than three components could be scored.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - A
          - B
          - C
          - D
          - insufficient_data
  - name: dqs_completeness
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: Average of dqs_mandatory_completeness and dqs_voluntary_depth, 0-1.
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 1
  - name: dqs_mandatory_completeness
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: Required metrics disclosed / required metrics, 0-1.
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 1
  - name: dqs_voluntary_depth
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: Leadership (voluntary) indicators with a substantive value / Leadership indicators of the taxonomy, 0-1.
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 1
  - name: dqs_internal_consistency
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: 1 - failed checks / applicable checks inside the filing, 0-1.
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 1
  - name: dqs_temporal_consistency
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: 1 - flagged metrics / comparable metrics against the next report, 0-1; empty when there is no later filing.
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 1
  - name: dqs_assurance
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: Assurance points, 0-1 (baseline of the level plus the whole-report bonus); empty before FY2023-24.
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 1
  - name: dqs_components_used
    data_type: INTEGER
    config:
      meta:
        public_safe: true
    description: How many of the four components could be scored.
    tests:
    - not_null
  - name: is_provisional
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: true when the temporal check could not be run because no later filing exists yet; the score can still fall.
    tests:
    - not_null
  - name: assurance_level
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: reasonable, assessment, limited or not_disclosed; empty before FY2023-24.
  - name: assurance_scope
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: all (whole report covered) or partial; empty when nothing is assured.
  - name: dqs_group_n
    data_type: INTEGER
    config:
      meta:
        public_safe: true
    description: Companies of the ranking group with a gradable score that financial year.
  - name: dqs_rank_in_group
    data_type: INTEGER
    config:
      meta:
        public_safe: true
    description: Rank within ranking group and financial year, 1 = best; only with at least three components and dqs_group_n of at least 5.
  - name: dqs_percentile_in_group
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: Percentile within ranking group and financial year, 100 = best; same conditions as the rank.
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 100
  - name: dqs_reason_codes
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: 'Up to three reasons for lost points, largest first, separated by a pipe: missing_required_metrics, low_voluntary_disclosure, waste_balance_gap, waste_recovery_over_100, implausible_zero, unit_inconsistency, suspected_scale_error, material_restatement, unexplained_yoy_anomaly, assurance_core_only, assessment_not_assurance, limited_assurance, no_assurance.'
- name: rpt_public_disclosure_quality
  description: 'PUBLIC model (docs/publication_policy.md): only values we calculate, no raw filed quantity.
    Disclosure Quality Score, component scores, grade, rank, percentile and reason codes; the counts behind
