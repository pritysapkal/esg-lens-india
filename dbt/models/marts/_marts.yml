  - name: dqs_total
    description: Disclosure Quality Score, 0-100, one decimal; empty if fewer than two components could be scored. Compare only within a financial year.
  - name: dqs_grade
    description: A (85 and above), B (70 to below 85), C (55 to below 70), D (below 55); insufficient_data when fewer than three components could be scored.
  - name: dqs_completeness
    description: Average of dqs_mandatory_completeness and dqs_voluntary_depth, 0-1.
  - name: dqs_mandatory_completeness
    description: Required metrics disclosed / required metrics, 0-1.
  - name: dqs_voluntary_depth
    description: Leadership (voluntary) indicators with a substantive value / Leadership indicators of the taxonomy, 0-1.
  - name: dqs_internal_consistency
    description: 1 - failed checks / applicable checks inside the filing, 0-1.
  - name: dqs_temporal_consistency
    description: 1 - flagged metrics / comparable metrics against the next report, 0-1; empty when there is no later filing.
  - name: dqs_assurance
    description: Assurance points, 0-1 (baseline of the level plus the whole-report bonus); empty before FY2023-24.
  - name: dqs_components_used
    description: How many of the four components could be scored.
  - name: is_provisional
