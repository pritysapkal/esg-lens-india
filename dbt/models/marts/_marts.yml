# Gold layer (marts). Every dim_/fct_/bridge model has an enforced contract: column names and
# data types are fixed here and checked on every build. When a model gains or changes a column,
# update its entry here (dbt reports the mismatch). config.meta.public_safe on the fact columns
# follows docs/publication_policy.md (false = raw filed value, never published).
version: 2
models:
- name: dim_company
  description: 'One row per company, keyed by ISIN. Identity (current name, symbol, CIN), filing coverage,
    NIFTY 50 membership, NSE industry, peer group (peer_groups seed) and NIC sector from the latest filing
    with a usable NIC code. Method: docs/company_identity.md.

    '
  config:
    contract:
      enforced: true
  columns:
  - name: isin
    data_type: VARCHAR
    description: ISIN of the equity share - the company key everywhere.
    tests:
    - unique
    - not_null
  - name: current_name
    data_type: VARCHAR
    description: Cleaned name in the latest filing.
    tests:
    - not_null
  - name: current_symbol
    data_type: VARCHAR
    description: NSE symbol in the latest filing.
    tests:
    - unique
    - not_null
  - name: cin
    data_type: VARCHAR
    description: Corporate Identity Number, empty for statutory bodies and placeholders.
  - name: all_symbols
    data_type: VARCHAR
    description: Every symbol the company filed under, comma separated.
  - name: first_fy
    data_type: VARCHAR
    description: First financial year with a filing.
  - name: last_fy
    data_type: VARCHAR
    description: Last financial year with a filing.
  - name: n_filings
    data_type: BIGINT
    description: Number of filings received for the company.
    tests:
    - not_null
  - name: in_universe
    data_type: BOOLEAN
    description: true if the company is in the NIFTY 50 constituents file.
    tests:
    - not_null
  - name: nse_industry
    data_type: VARCHAR
    description: NSE industry from the NIFTY 50 file; empty for companies outside it.
  - name: peer_group
    data_type: VARCHAR
    description: One of the nine peer groups (seed peer_groups).
    tests:
    - not_null:
        config:
          tags:
          - realdata
    - accepted_values:
        arguments:
          values:
          - Financials
          - IT services
          - Energy & utilities
          - Metals & mining
          - Cement & construction
          - Automobiles
          - Consumer
          - Healthcare
          - Industrials & others
  - name: sector_group
    data_type: VARCHAR
    description: Financials, Asset-light or Asset-heavy (seed peer_groups).
    tests:
    - accepted_values:
        arguments:
          values:
          - Financials
          - Asset-light
          - Asset-heavy
  - name: sub_industry
    data_type: VARCHAR
    description: Financials sub-industry (Banks, NBFC, Insurance, Market infrastructure) or the NSE industry.
  - name: peer_group_sort
    data_type: INTEGER
    description: Sort order of the peer group for Power BI.
  - name: sector_group_sort
    data_type: INTEGER
    description: Sort order of the sector group for Power BI.
  - name: display_name
    data_type: VARCHAR
    description: Short name for charts (company_attributes seed), else the current name.
    tests:
    - not_null
  - name: ownership_type
    data_type: VARCHAR
    description: Government, Private Indian or MNC subsidiary (company_attributes seed; unverified).
  - name: business_group
    data_type: VARCHAR
    description: Business group or Independent (company_attributes seed; unverified).
  - name: nic_primary_code
    data_type: VARCHAR
    description: NIC code with the highest turnover share in the latest filing with NIC data.
  - name: nic_division_2d
    data_type: VARCHAR
    description: First two digits of nic_primary_code.
    tests:
    - relationships:
        arguments:
          to: ref('nic_sector_map')
          field: nic_division_2d
  - name: nic_division_name
    data_type: VARCHAR
    description: NIC-2008 division name (seed nic_sector_map).
  - name: nic_agrees_with_peer_group
    data_type: BOOLEAN
    description: 'true if the NIC primary division points to the company''s peer group (cross-check only;
      the peer group itself comes from the NSE industry via the seed).

      '
  - name: nic_fiscal_year_label
    data_type: VARCHAR
    description: Financial year of the filing the NIC data comes from.
  - name: nic_top_division_share
    data_type: DOUBLE
    description: Turnover share of the largest NIC division.
  - name: nic_n_divisions_ge_15pct
    data_type: BIGINT
    description: Number of NIC divisions with at least 15% of turnover each.
  - name: top_3_nic_codes
    data_type: VARCHAR
    description: The three largest NIC codes with their turnover share.
  - name: is_conglomerate
    data_type: BOOLEAN
    description: true if top division below 60% of turnover or three or more divisions at 15% or more.
  - name: peer_group_n
    data_type: BIGINT
    description: Number of companies in the peer group.
  - name: ranking_group
    data_type: VARCHAR
    description: 'Group a company is ranked in: its peer group if that has at least 5 companies and is
      not "Industrials & others", else its sector group.

      '
    tests:
    - not_null:
        config:
          tags:
          - realdata
  - name: ranking_basis
    data_type: VARCHAR
    description: peer_group or sector_group - which level ranking_group is.
    tests:
    - accepted_values:
        arguments:
          values:
          - peer_group
          - sector_group
  - name: caution_note
    data_type: VARCHAR
    description: Warning shown with the ranking, set for the heterogeneous group.
  - name: universe_basis
    data_type: VARCHAR
    description: Which companies the data covers and for which years.
- name: dim_company_year
  description: 'One row per company (ISIN) and financial year, from the latest filing of that year: period,
    boundary, annualisation factor, turnover, headcount, assurance status, structural-break flag and size
    band. Size band = tercile of turnover within sector group and year (Financials: total headcount).
    Method: docs/company_identity.md.

    '
  config:
    contract:
      enforced: true
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - fiscal_year_label
  columns:
  - name: isin
    data_type: VARCHAR
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_company')
          field: isin
  - name: fiscal_year_label
    data_type: VARCHAR
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_fiscal_year')
          field: fiscal_year_label
  - name: filing_id
    data_type: VARCHAR
    description: The latest filing of that company and year.
    tests:
    - unique
    - not_null
  - name: symbol
    data_type: VARCHAR
    description: NSE symbol in that filing.
  - name: display_name
    data_type: VARCHAR
    description: Short name for charts (company_attributes seed).
  - name: peer_group
    data_type: VARCHAR
    description: Peer group (seed peer_groups).
    tests:
    - not_null:
        config:
          tags:
          - realdata
  - name: sector_group
    data_type: VARCHAR
    description: Financials, Asset-light or Asset-heavy.
  - name: ranking_group
    data_type: VARCHAR
    description: Group the company is ranked in (see dim_company).
  - name: peer_group_sort
    data_type: INTEGER
    description: Sort order of the peer group for Power BI.
  - name: sector_group_sort
    data_type: INTEGER
    description: Sort order of the sector group for Power BI.
  - name: reporting_boundary
    data_type: VARCHAR
    description: standalone or consolidated.
  - name: period_start
    data_type: DATE
    description: First day of the reporting period.
  - name: period_end
    data_type: DATE
    description: Last day of the reporting period.
    tests:
    - not_null
  - name: period_months
    data_type: INTEGER
    description: Length of the reporting period in months.
  - name: is_non_standard_period
    data_type: BOOLEAN
    description: true if the period is not a 12-month April-March year.
  - name: annualisation_factor
    data_type: DOUBLE
    description: 12 / period_months, e.g. 0.8 for a 15-month year.
  - name: taxonomy_version
    data_type: VARCHAR
    description: SEBI BRSR taxonomy version of the filing.
  - name: turnover_inr
    data_type: DOUBLE
    description: Corrected turnover in INR.
  - name: total_headcount
    data_type: DOUBLE
    description: Employees plus workers, permanent and other than permanent.
  - name: brsr_core_assurance_status
    data_type: VARCHAR
    description: assured, assessed or not disclosed.
  - name: has_event_break
    data_type: BOOLEAN
    description: true if a corporate event (corporate_events seed) breaks comparability this year.
  - name: boundary_changed_vs_prior
    data_type: BOOLEAN
    description: true if the reporting boundary (standalone/consolidated) differs from the company previous
      year in the data.
  - name: has_comparability_break
    data_type: BOOLEAN
    description: true if has_event_break or boundary_changed_vs_prior; the year-on-year change is not
      like for like.
  - name: comparability_break_reason
    data_type: VARCHAR
    description: merger, demerger, boundary change, or combined (e.g. "merger; boundary change"); empty
      if no break.
  - name: size_band
    data_type: VARCHAR
    description: Large, Mid or Small (terciles); empty if the size measure is missing.
    tests:
    - accepted_values:
        arguments:
          values:
          - Large
          - Mid
          - Small
  - name: size_band_basis
    data_type: VARCHAR
    description: total_headcount (Financials) or turnover_inr.
- name: dim_company_history
  description: 'Name and symbol history of each company (SCD type 2), derived from the filings: one row
    per run of consecutive years under the same name and symbol. See docs/adr/0003-company-history-scd2.md.

    '
  config:
    contract:
      enforced: true
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - valid_from_fy
  columns:
  - name: isin
    data_type: VARCHAR
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_company')
          field: isin
  - name: company_name
    data_type: VARCHAR
    tests:
    - not_null
  - name: symbol
    data_type: VARCHAR
    tests:
    - not_null
  - name: valid_from_fy
    data_type: VARCHAR
    description: First financial year filed under this name and symbol.
    tests:
    - not_null
  - name: valid_to_fy
    data_type: VARCHAR
    description: Last financial year filed under this name and symbol; empty for the current row.
  - name: is_current
    data_type: BOOLEAN
    tests:
    - not_null
  - name: n_years
    data_type: BIGINT
    description: Number of years in the run.
  - name: version_number
    data_type: HUGEINT
    description: 1 = earliest version of the company identity.
- name: dim_metric
  description: 'One row per catalogue metric: definition, unit type, direction, disclosure requirement
    and sort order.'
  config:
    contract:
      enforced: true
  columns:
  - name: metric_id
    data_type: VARCHAR
    description: Stable metric name (snake_case).
    tests:
    - unique
    - not_null
  - name: metric_name
    data_type: VARCHAR
    description: Plain-English name.
  - name: brsr_core_attribute
    data_type: VARCHAR
    description: BRSR Core attribute or analysis area, e.g. 1 GHG.
  - name: role
    data_type: VARCHAR
    description: headline, input, secondary, check_only, flag, quality or context.
    tests:
    - accepted_values:
        arguments:
          values:
          - headline
          - input
          - secondary
          - check_only
          - flag
          - quality
          - context
  - name: unit_std
    data_type: VARCHAR
    description: Standard unit; empty for text / enum metrics.
  - name: unit_type
    data_type: VARCHAR
    description: pct, count, quantity, intensity, days or text.
    tests:
    - accepted_values:
        arguments:
          values:
          - pct
          - count
          - quantity
          - intensity
          - days
          - text
  - name: direction
    data_type: VARCHAR
    description: lower_better, higher_better, context or n/a.
  - name: value_kind
    data_type: VARCHAR
    description: numeric, duration, text or enum.
  - name: indicator_type
    data_type: VARCHAR
    description: essential or leadership (metric_disclosure_requirement).
  - name: mandatory_from_fy
    data_type: VARCHAR
    description: First year the metric must be disclosed; empty for voluntary.
  - name: brsr_core
    data_type: BOOLEAN
    description: true if the metric is a BRSR Core attribute.
  - name: sort_order
    data_type: INTEGER
    description: Display order (by attribute, then metric).
- name: dim_assurer
  description: One row per assurance / assessment provider, spelling variants merged (seed assurer_aliases).
  config:
    contract:
      enforced: true
  columns:
  - name: assurer_key
    data_type: VARCHAR
    description: Stable key built from the canonical name.
    tests:
    - unique
    - not_null
  - name: assurer_name
    data_type: VARCHAR
    description: Canonical provider name.
    tests:
    - not_null
  - name: assurer_id
    data_type: VARCHAR
    description: Most frequent firm / company ID filed for the provider.
  - name: n_company_years
    data_type: INTEGER
    description: Company-years in which the provider is named.
  - name: n_companies
    data_type: INTEGER
    description: Companies that name the provider.
  - name: first_fy
    data_type: VARCHAR
    description: First financial year the provider is named.
  - name: last_fy
    data_type: VARCHAR
    description: Last financial year the provider is named.
  - name: n_name_variants
    data_type: INTEGER
    description: Distinct spellings merged into this provider.
- name: bridge_company_year_assurer
  description: Assurer(s) of each company-year (many-to-many). assurance_type is the BRSR Core scope (All
    / Partial), filed from FY2024-25.
  config:
    contract:
      enforced: true
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - fiscal_year_label
        - assurer_key
  columns:
  - name: isin
    data_type: VARCHAR
    description: ISIN of the company (key of dim_company).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_company')
          field: isin
  - name: fiscal_year_label
    data_type: VARCHAR
    description: Financial year, e.g. FY2025-26.
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_fiscal_year')
          field: fiscal_year_label
  - name: assurer_key
    data_type: VARCHAR
    description: Provider (key of dim_assurer).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_assurer')
          field: assurer_key
  - name: assurance_type
    data_type: VARCHAR
    description: All or Partial; empty when not filed.
- name: fct_esg_value
  description: 'Every catalogue metric value of every filing, current-year values and prior-year comparatives.
    Grain: company x metric x year of the value x breakdown x source filing. is_latest_value marks the
    official current value (CY value of the latest revision of the filing for that year).'
  config:
    contract:
      enforced: true
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - metric_id
        - value_fiscal_year_label
        - dimension_key
        - source_filing_id
  columns:
  - name: isin
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: ISIN of the company (key of dim_company).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_company')
          field: isin
  - name: symbol
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: NSE symbol in the filing.
  - name: metric_id
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Catalogue metric (key of dim_metric).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_metric')
          field: metric_id
  - name: value_fiscal_year_label
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Financial year the value belongs to.
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_fiscal_year')
          field: fiscal_year_label
  - name: dimension_key
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Breakdown of the value (axis=member pairs); empty = company-wide.
    tests:
    - not_null
  - name: source_filing_id
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Filing the value comes from.
    tests:
    - not_null
  - name: filing_fiscal_year_label
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Financial year of the source filing.
  - name: value_std
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: Value in the metric standard unit (after normalisation and approved overrides).
  - name: best_value_std
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: 'Value gold KPIs use: value_std, or the later comparative when the filed value is a suspected
      scale error.'
  - name: best_value_source
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: as_filed or replaced_by_later_comparative.
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - as_filed
          - replaced_by_later_comparative
  - name: unit_std
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Standard unit of the metric.
  - name: value_pct
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: Value on a 0-100 scale for percent metrics.
  - name: raw_value
    data_type: VARCHAR
    config:
      meta:
        public_safe: false
    description: Value exactly as filed.
  - name: value_text
    data_type: VARCHAR
    config:
      meta:
        public_safe: false
    description: Text value for text / enum metrics.
  - name: period_role
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: CY (reporting year), PY or PY2 (comparatives).
    tests:
    - accepted_values:
        arguments:
          values:
          - CY
          - PY
          - PY2
  - name: source_citation
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: 'Plain-text citation: company, report, year, filing date.'
  - name: is_current_year_value
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: true for CY values.
  - name: is_latest_value
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: true for the official current value of the company-year.
  - name: is_latest_revision_filing
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: true if the source filing is the latest revision of its company-year.
  - name: unit_resolution_method
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: as-filed, text-unit, default or bridged-from-next-filing.
    tests:
    - accepted_values:
        arguments:
          values:
          - as-filed
          - text-unit
          - default
          - bridged-from-next-filing
  - name: override_id
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Approved manual override applied to the value, if any.
  - name: normalisation_flag
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: How the value was converted (pipe-separated flags).
  - name: is_material
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: Whether the metric is ranked (material) for the company peer group.
  - name: n_competing_values
    data_type: INTEGER
    config:
      meta:
        public_safe: true
    description: Facts in the filing for the same grain before one was kept.
- name: fct_company_year
  description: 'One wide row per company and financial year: reported values and KPIs derived from the
    latest current-year values. Percent columns are 0-100; intensities per Rs crore of corrected turnover.
    Definitions: docs/kpi_definitions.md.'
  config:
    contract:
      enforced: true
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - fiscal_year_label
  - dbt_utils.equal_rowcount:
      arguments:
        compare_model: ref('dim_company_year')
  columns:
  - name: isin
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: ISIN of the company (key of dim_company).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_company')
          field: isin
  - name: fiscal_year_label
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Financial year, e.g. FY2025-26.
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_fiscal_year')
          field: fiscal_year_label
  - name: filing_id
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Latest filing of the company-year.
    tests:
    - unique
    - not_null
  - name: symbol
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: NSE symbol in the filing.
  - name: display_name
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Short company name for charts.
  - name: peer_group
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Peer group (seed peer_groups).
  - name: sector_group
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Financials, Asset-light or Asset-heavy.
  - name: ranking_group
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Group the company is ranked in.
  - name: size_band
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Large, Mid or Small (terciles within sector group and year).
  - name: size_band_basis
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: total_headcount (Financials) or turnover_inr.
  - name: ownership_type
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Government, Private Indian or MNC subsidiary.
  - name: business_group
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Business group or Independent.
  - name: reporting_boundary
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: standalone or consolidated.
  - name: brsr_core_assurance_status
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: assured, assessed or not disclosed.
  - name: assurance_type
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: 'Scope of the BRSR Core assurance: All or Partial.'
  - name: has_comparability_break
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: true if an event or boundary change breaks comparability with the previous year.
  - name: comparability_break_reason
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: merger, demerger, boundary change or combined.
  - name: period_months
    data_type: INTEGER
    config:
      meta:
        public_safe: true
    description: Length of the reporting period in months.
  - name: annualisation_factor
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: 12 / period_months.
  - name: turnover_inr
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: Corrected turnover in INR.
  - name: turnover_cr
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: turnover_inr / 1e7 (Rs crore).
  - name: headcount_total
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: Employees + workers, permanent and other than permanent.
  - name: headcount_female
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: Female employees + female workers (same basis).
  - name: female_workforce_pct
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: headcount_female / headcount_total x 100.
  - name: female_wage_share_pct
    data_type: DOUBLE
    config:
      meta:
