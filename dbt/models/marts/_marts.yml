- name: fct_peer_benchmark
  description: Distribution of each comparable KPI per ranking group and year (n, median, quartiles, min,
    max). Only KPIs material for the group appear. Levels include years with comparability breaks.
  config:
    contract:
      enforced: true
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - ranking_group
        - fiscal_year_label
        - kpi_name
  columns:
  - name: ranking_group
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Group the company is ranked in.
    tests:
    - not_null
  - name: fiscal_year_label
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Financial year, e.g. FY2025-26.
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_fiscal_year')
          field: fiscal_year_label
  - name: kpi_name
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: KPI column of fct_company_year (seed kpi_catalogue).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('kpi_catalogue')
          field: kpi_name
  - name: kpi_label
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Plain-English KPI name.
  - name: unit_type
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: pct, intensity or days.
  - name: direction
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: lower_better, higher_better or context.
  - name: n_companies_in_group
    data_type: INTEGER
    config:
      meta:
        public_safe: true
    description: Companies in the ranking group that year.
  - name: n_companies
    data_type: INTEGER
    config:
      meta:
        public_safe: true
    description: Companies with a value for the KPI.
  - name: has_min_n
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: true if at least 5 companies have a value.
  - name: median_value
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: Median of the KPI.
  - name: p25_value
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: 25th percentile.
  - name: p75_value
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: 75th percentile.
  - name: min_value
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: Lowest value.
  - name: max_value
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: Highest value.
- name: fct_company_kpi_percentile
  description: Percentile of each company within its ranking group per KPI and year, 0-100 with 100 =
    best. Null with a reason when the group has fewer than 5 companies with a value, the KPI is not material
    for the group, or the KPI has no direction.
  config:
    contract:
      enforced: true
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - fiscal_year_label
        - kpi_name
  columns:
  - name: isin
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: ISIN of the company (key of dim_company).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_company')
          field: isin
  - name: fiscal_year_label
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Financial year, e.g. FY2025-26.
  - name: kpi_name
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: KPI column of fct_company_year.
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('kpi_catalogue')
          field: kpi_name
  - name: ranking_group
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Group the company is ranked in.
  - name: value
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: The company's KPI value.
  - name: group_n
    data_type: INTEGER
    config:
      meta:
        public_safe: true
    description: Companies in the group with a value.
  - name: percentile_in_group
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: 0-100, direction-aware (100 = best).
    tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          max_value: 100
  - name: percentile_null_reason
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Why the percentile is empty.
    tests:
    - accepted_values:
        arguments:
          values:
          - no_group
          - no_value
          - flagged_value
          - not_material
          - no_direction
          - group_n_lt_5
- name: fct_restatement
  description: 'Original value (filed for year Y) against the comparative for Y filed in year Y+1, per
    company, metric and breakdown, with classification, explanation and a flag for restatements that flatter
    the trend. Method: docs/restatement_method.md. A restatement is not wrongdoing.'
  config:
    contract:
      enforced: true
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - metric_id
        - dimension_key
        - value_fiscal_year_label
        - restating_filing_id
  columns:
  - name: isin
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: ISIN of the company (key of dim_company).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_company')
          field: isin
  - name: symbol
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: NSE symbol in the filing.
  - name: metric_id
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Catalogue metric (key of dim_metric).
    tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_metric')
          field: metric_id
  - name: dimension_key
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Breakdown of the value (axis=member pairs); empty = company-wide.
  - name: value_fiscal_year_label
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Year Y the value belongs to.
  - name: restating_fiscal_year_label
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Year Y+1 of the filing that restates it.
  - name: original_filing_id
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Filing for year Y.
  - name: restating_filing_id
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: Filing for year Y+1.
  - name: original_value
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: CY value of year Y from the filing for Y.
  - name: restated_value
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: PY value of year Y from the filing for Y+1.
  - name: abs_change
    data_type: DOUBLE
    config:
      meta:
        public_safe: false
    description: restated - original.
  - name: pct_change
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: (restated - original) / |original|; empty when original is 0.
  - name: pp_change
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: restated - original in percentage points (percent metrics only).
  - name: unit_type
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: pct, count, quantity, intensity or days.
  - name: direction
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: lower_better, higher_better, context or n/a.
  - name: classification
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: no_change, minor, material, unit_inconsistency, from_zero, to_zero, suspected_scale_error
      or unit_inferred_from_restating_filing.
    tests:
    - accepted_values:
        arguments:
          values:
          - no_change
          - minor
          - material
          - unit_inconsistency
          - from_zero
          - to_zero
          - suspected_scale_error
          - unit_inferred_from_restating_filing
  - name: is_compared
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: false for circular pairs and suspected scale errors; those are excluded from statistics.
  - name: ratio
    data_type: DOUBLE
    config:
      meta:
        public_safe: true
    description: restated / original (both positive).
  - name: original_unit_resolution_method
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: How the unit of the original value was decided.
  - name: explained_by
    data_type: VARCHAR
    config:
      meta:
        public_safe: true
    description: merger/demerger, boundary change, possible note (weak), or empty.
    tests:
    - accepted_values:
        arguments:
          values:
          - merger/demerger
          - boundary change
          - possible note (weak)
        config:
          where: explained_by is not null
  - name: stated_reason
    data_type: VARCHAR
    config:
      meta:
        public_safe: false
    description: Snippet (<= 300 characters) of the possible restatement note; no links.
  - name: flatters_trend
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: 'For material pairs: true if the restatement makes the Y to Y+1 change look better.'
  - name: red_flag
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: material, flattering and with no explanation of any kind.
  - name: red_flag_strict
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: material, flattering and not explained by a merger / demerger or boundary change (a weak
      note does not count).
  - name: is_metric_material
    data_type: BOOLEAN
    config:
      meta:
        public_safe: true
    description: Whether the metric is ranked for the company peer group.
- name: rpt_restatement_summary
  description: 'Restatement summary by overall, metric, peer group and company, plus a KPMG-comparable
    block: pairs compared (circular pairs and suspected scale errors excluded), share per class, unexplained
    and flattering shares of material restatements, red flags, and companies with at least one material
    restatement.'
  columns:
  - name: level
    description: overall, metric, peer_group, company or kpmg_comparable.
    tests:
    - accepted_values:
        arguments:
          values:
          - overall
          - metric
          - peer_group
          - company
          - kpmg_comparable
  - name: group_key
    description: Value of the level (metric id, peer group, symbol).
    tests:
    - not_null
- name: rpt_public_company_year
  description: 'PUBLIC model (docs/publication_policy.md): only values we calculate, no raw filed quantity.
    Company-year KPIs: intensities, percentages, ratios, gaps and yes/no flags, with names and groups.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - isin
        - fiscal_year_label
  - dbt_utils.equal_rowcount:
      arguments:
        compare_model: ref('fct_company_year')
  columns:
  - name: isin
    description: ISIN of the company (key of dim_company).
    tests:
    - not_null
  - name: symbol
    description: NSE symbol in the filing.
  - name: display_name
    description: Short company name for charts.
  - name: fiscal_year_label
    description: Financial year, e.g. FY2025-26.
  - name: peer_group
    description: Peer group (seed peer_groups).
  - name: sector_group
    description: Financials, Asset-light or Asset-heavy.
  - name: ranking_group
    description: Group the company is ranked in.
  - name: size_band
    description: Large, Mid or Small (terciles within sector group and year).
  - name: ownership_type
    description: Government, Private Indian or MNC subsidiary.
  - name: business_group
    description: Business group or Independent.
  - name: reporting_boundary
    description: standalone or consolidated.
  - name: brsr_core_assurance_status
    description: assured, assessed or not disclosed.
  - name: assurance_type
    description: 'Scope of the BRSR Core assurance: All or Partial.'
  - name: has_comparability_break
    description: true if an event or boundary change breaks comparability with the previous year.
  - name: comparability_break_reason
    description: merger, demerger, boundary change or combined.
  - name: period_months
    description: Length of the reporting period in months.
  - name: annualisation_factor
    description: 12 / period_months.
  - name: female_workforce_pct
    description: headcount_female / headcount_total x 100.
  - name: pay_equity_gap_pp
    description: female_wage_share_pct - female_workforce_pct, in percentage points; negative = women
      get a smaller share of wages than of headcount.
  - name: attrition_gap_pp
    description: attrition_female_pct - attrition_male_pct, in percentage points.
  - name: scope3_disclosed
    description: true if a Scope 3 value is filed.
  - name: ghg_intensity_tco2e_per_cr
    description: ghg_s12_tco2e / turnover_cr (computed by us).
  - name: ghg_intensity_filed_basis
    description: 'Denominator the company used for its filed GHG intensity: per rupee (as required), per
      lakh, per million, per crore or other/unclear.'
  - name: renewable_share_pct
    description: energy_renewable_gj / energy_total_gj x 100.
  - name: energy_intensity_gj_per_cr
    description: energy_total_gj / turnover_cr (computed).
  - name: energy_intensity_filed_basis
    description: Denominator used for the filed energy intensity.
  - name: water_intensity_kl_per_cr
    description: water_consumption_kl / turnover_cr (computed).
  - name: water_intensity_filed_basis
    description: Denominator used for the filed water intensity.
  - name: waste_recovery_rate_pct
    description: waste_recovered_t / waste_generated_t x 100.
  - name: waste_intensity_t_per_cr
    description: waste_generated_t / turnover_cr.
  - name: waste_balance_gap_pct
    description: (generated - recovered - disposed) / generated x 100; far from 0 means inconsistent inputs.
  - name: any_fatality
