  - name: n_values_replaced
    description: Current-year values of this company-year replaced by the later comparative (suspected
      scale errors).
  - name: kpi_flags
    description: 'Pipe-separated flags: implausible zeros set to empty, waste recovery above 100%, values
      replaced. Empty if none.'
