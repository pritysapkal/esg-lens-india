version: 2

exposures:
  - name: power_bi_esg_lens
    label: ESG Lens India - Power BI report
    type: dashboard
    maturity: low
    owner:
      name: Prity Sapkal
      email: sapkalprity01@gmail.com
    description: >
      Power BI report over the gold star schema: company report cards, peer benchmarks, KPI
      percentiles and disclosure quality. Reads the facts and dimensions below; no logic lives
      in the report. Group figures (a sector, a peer group, a year) are the metrics of the
      semantic layer listed below, exported from its saved queries, so they equal the numbers of
      every other tool (docs/semantic_layer.md).
    depends_on:
      - metric('ghg_intensity_agg')
      - metric('ghg_intensity_median')
      - metric('energy_intensity_agg')
      - metric('water_intensity_agg')
      - metric('waste_intensity_agg')
      - metric('renewable_share_agg')
      - metric('female_workforce_agg')
      - metric('dqs_median')
      - metric('dqs_grade_a_share')
      - metric('material_restatement_share')
      - metric('companies_reporting')
      - ref('fct_company_year')
      - ref('fct_esg_value')
      - ref('fct_peer_benchmark')
      - ref('fct_company_kpi_percentile')
      - ref('fct_disclosure_quality')
      - ref('dim_company')
      - ref('dim_company_year')
      - ref('dim_company_history')
      - ref('dim_metric')
      - ref('dim_assurer')
      - ref('bridge_company_year_assurer')

  - name: restatement_report
    label: ESG Lens India - restatement report
    type: dashboard
    maturity: low
    owner:
      name: Prity Sapkal
      email: sapkalprity01@gmail.com
    description: >
      Restatement tracker report: which prior-year BRSR figures were revised in the next report,
      how large, whether explained, and which flatter the trend. Restatement is not wrongdoing.
    depends_on:
      - ref('fct_restatement')
      - ref('rpt_restatement_summary')
      - ref('dim_company')
      - ref('dim_metric')

  - name: public_showcase
    label: ESG Lens India - public showcase
    type: application
    maturity: low
    owner:
      name: Prity Sapkal
      email: sapkalprity01@gmail.com
    description: >
      Anything published outside this laptop (Streamlit report card, public Power BI version,
      screenshots): reads only the public models, which hold values we calculate. Group figures
      come from rpt_public_group_metrics, never from the semantic layer: there a statistic is
      already empty when fewer than 5 companies stand behind it. The Disclosure Quality Score
      shown there is not an ESG rating. Policy: docs/publication_policy.md.
    depends_on:
      - ref('rpt_public_company_year')
      - ref('rpt_public_disclosure_quality')
      - ref('rpt_public_group_metrics')
      - ref('rpt_public_restatement_summary')
