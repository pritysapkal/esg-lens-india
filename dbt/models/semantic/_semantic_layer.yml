    description: 'Companies with a voluntary depth: count of distinct companies with dqs_voluntary_depth.'
  - name: material_restatements
    description: 'Material restatements: count of compared pairs classified material. Empty (not 0) when the year has no later filing yet.'
  - name: material_restatement_share
    description: 'Figures materially restated (%): compared pairs classified material / compared pairs x 100. Empty when companies_with_compared_restatements is below 5 or the year has no later filing yet.'
  - name: suspected_scale_errors
    description: 'Suspected scale errors: count of pairs classified suspected_scale_error. Empty (not 0) when the year has no later filing yet.'
  - name: companies_with_compared_restatements
