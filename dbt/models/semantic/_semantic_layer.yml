  - name: renewable_share_agg_num
    type: simple
    description: Building block (numerator); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when energy_renewable_gj is not null and energy_total_gj <> 0 then 100.0 * energy_renewable_gj end
