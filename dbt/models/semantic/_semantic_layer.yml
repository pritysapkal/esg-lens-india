# GENERATED by scripts/build_semantic_layer.py from dbt/seeds/kpi_catalogue.csv - do not edit.
# To change a metric, edit the seed and run:  python scripts/build_semantic_layer.py
# Spec: dbt 1.12 semantic layer (semantic_model under the model, entities / dimensions under the
# columns, simple metrics instead of measures). Plain-English guide: docs/semantic_layer.md.
# meta.public_safe follows docs/publication_policy.md; meta.min_companies = 5 means the figure
# is reliable only when meta.companies_metric is 5 or more for the same group. Public tools read
# rpt_public_group_metrics (built from the same definitions), where smaller groups are empty.
version: 2
models:
- name: sem_company_year
  description: 'Semantic model of the company-year KPIs (view of fct_company_year). Holds the shared group dimensions of every metric: query them as company_year__peer_group, company_year__sector_group and so on. Local only: the view has raw filed values.'
  semantic_model: true
  agg_time_dimension: fiscal_year_end
  columns:
  - name: company_year_key
    description: 'ISIN and financial year joined by a bar: the key of a company-year.'
    entity:
      name: company_year
      type: primary
    data_tests:
    - unique
    - not_null
  - name: isin
    description: ISIN of the company.
    entity:
      name: company
      type: foreign
  - name: fiscal_year_end
    description: Last day of the financial year (31 March). The time dimension, by year.
    granularity: year
    dimension:
      type: time
    data_tests:
    - not_null
  - name: fiscal_year_label
    description: Financial year as text, e.g. FY2025-26.
    dimension:
      type: categorical
  - name: peer_group
    description: One of the nine peer groups.
    dimension:
      type: categorical
  - name: sector_group
    description: Financials, Asset-light or Asset-heavy.
    dimension:
      type: categorical
  - name: ranking_group
    description: Group the company is ranked in.
    dimension:
      type: categorical
  - name: size_band
    description: Large, Mid or Small within sector group and year.
    dimension:
      type: categorical
  - name: ownership_type
    description: Government, Private Indian or MNC subsidiary.
    dimension:
      type: categorical
  metrics:
  - name: ghg_intensity_agg_num
    type: simple
    description: Building block (numerator); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when ghg_s12_tco2e is not null and turnover_cr <> 0 then ghg_s12_tco2e end
    config:
      meta:
        public_safe: false
        metric_type: input
  - name: ghg_intensity_agg_den
    type: simple
    description: Building block (denominator); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when ghg_s12_tco2e is not null and turnover_cr <> 0 then turnover_cr end
    config:
      meta:
        public_safe: false
        metric_type: input
  - name: ghg_intensity_agg
    label: GHG intensity, whole group
    description: 'All the Scope 1+2 emissions of the group divided by all its turnover: the intensity of the group as if it were one company. Large companies weigh more.'
    type: ratio
    numerator: ghg_intensity_agg_num
    denominator: ghg_intensity_agg_den
    config:
      meta:
        public_safe: true
        metric_type: ratio_of_sums
        unit: tCO2e per Rs crore
        direction: lower_better
        min_companies: 5
        companies_metric: companies_with_ghg_intensity
  - name: ghg_intensity_median
    label: GHG intensity, typical company
    description: 'The intensity of the company in the middle of the group: half the companies are below it, half above. Every company weighs the same.'
    type: simple
    agg: percentile
    percentile: 0.5
    expr: ghg_intensity_tco2e_per_cr
    config:
      meta:
        public_safe: true
        metric_type: median
        unit: tCO2e per Rs crore
        direction: lower_better
        min_companies: 5
        companies_metric: companies_with_ghg_intensity
  - name: companies_with_ghg_intensity
    label: Companies with a ghg intensity
    description: How many companies of the group have a ghg intensity. The whole-group and typical-company figures may be published only when this is 5 or more.
    type: simple
    agg: count_distinct
    expr: case when ghg_intensity_tco2e_per_cr is not null then isin end
    config:
      meta:
        public_safe: true
        metric_type: count_distinct
        unit: companies
        direction: context
  - name: energy_intensity_agg_num
    type: simple
    description: Building block (numerator); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when energy_total_gj is not null and turnover_cr <> 0 then energy_total_gj end
    config:
      meta:
        public_safe: false
        metric_type: input
  - name: energy_intensity_agg_den
    type: simple
    description: Building block (denominator); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when energy_total_gj is not null and turnover_cr <> 0 then turnover_cr end
    config:
      meta:
        public_safe: false
        metric_type: input
  - name: energy_intensity_agg
    label: Energy intensity, whole group
    description: 'All the energy used of the group divided by all its turnover: the intensity of the group as if it were one company. Large companies weigh more.'
    type: ratio
    numerator: energy_intensity_agg_num
    denominator: energy_intensity_agg_den
    config:
      meta:
        public_safe: true
        metric_type: ratio_of_sums
        unit: GJ per Rs crore
        direction: lower_better
        min_companies: 5
        companies_metric: companies_with_energy_intensity
  - name: energy_intensity_median
    label: Energy intensity, typical company
    description: 'The intensity of the company in the middle of the group: half the companies are below it, half above. Every company weighs the same.'
    type: simple
    agg: percentile
    percentile: 0.5
    expr: energy_intensity_gj_per_cr
    config:
      meta:
        public_safe: true
        metric_type: median
        unit: GJ per Rs crore
        direction: lower_better
        min_companies: 5
        companies_metric: companies_with_energy_intensity
  - name: companies_with_energy_intensity
    label: Companies with a energy intensity
    description: How many companies of the group have a energy intensity. The whole-group and typical-company figures may be published only when this is 5 or more.
    type: simple
    agg: count_distinct
    expr: case when energy_intensity_gj_per_cr is not null then isin end
    config:
      meta:
        public_safe: true
        metric_type: count_distinct
        unit: companies
        direction: context
  - name: water_intensity_agg_num
    type: simple
    description: Building block (numerator); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when water_consumption_kl is not null and turnover_cr <> 0 then water_consumption_kl end
