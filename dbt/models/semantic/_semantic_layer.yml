  - name: waste_intensity_agg_den
    type: simple
    description: Building block (denominator); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when waste_generated_t is not null and turnover_cr <> 0 then turnover_cr end
    config:
      meta:
        public_safe: false
        metric_type: input
  - name: waste_intensity_agg
    label: Waste intensity, whole group
    description: 'All the waste generated of the group divided by all its turnover: the intensity of the group as if it were one company. Large companies weigh more.'
    type: ratio
    numerator: waste_intensity_agg_num
    denominator: waste_intensity_agg_den
    config:
      meta:
        public_safe: true
        metric_type: ratio_of_sums
        unit: t per Rs crore
        direction: lower_better
        min_companies: 5
        companies_metric: companies_with_waste_intensity
  - name: waste_intensity_median
    label: Waste intensity, typical company
    description: 'The intensity of the company in the middle of the group: half the companies are below it, half above. Every company weighs the same.'
    type: simple
    agg: percentile
    percentile: 0.5
    expr: waste_intensity_t_per_cr
    config:
      meta:
        public_safe: true
        metric_type: median
        unit: t per Rs crore
        direction: lower_better
        min_companies: 5
        companies_metric: companies_with_waste_intensity
  - name: companies_with_waste_intensity
    label: Companies with a waste intensity
    description: How many companies of the group have a waste intensity. The whole-group and typical-company figures may be published only when this is 5 or more.
    type: simple
    agg: count_distinct
