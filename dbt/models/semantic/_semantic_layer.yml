  - name: companies_with_waste_intensity
    description: 'Companies with a waste intensity: count of distinct companies with waste_intensity_t_per_cr.'
  - name: renewable_share_agg
    description: 'Renewable share of energy, whole group (%): sum(energy_renewable_gj) / sum(energy_total_gj) x 100 over the companies that have both. Empty when companies_with_renewable_share is below 5.'
