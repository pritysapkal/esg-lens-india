        companies_metric: companies_reporting
- name: sem_disclosure_quality
  description: Semantic model of the Disclosure Quality Score (view of fct_disclosure_quality). Group dimensions come from sem_company_year through the company_year entity.
  semantic_model: true
  agg_time_dimension: fiscal_year_end
  primary_entity: disclosure_quality
  columns:
  - name: company_year_key
    description: Key of the company-year the score belongs to.
    entity:
      name: company_year
      type: foreign
    data_tests:
    - unique
    - not_null
  - name: isin
    description: ISIN of the company.
    entity:
      name: company
      type: foreign
  - name: fiscal_year_end
    description: Last day of the financial year (31 March). The time dimension, by year.
    granularity: year
    dimension:
      type: time
    data_tests:
    - not_null
  - name: dqs_grade
    description: A, B, C, D or insufficient_data.
    dimension:
      type: categorical
  - name: is_provisional
    description: true when the temporal check could not be run yet.
    dimension:
      type: categorical
  - name: assurance_level
    description: reasonable, assessment, limited or not_disclosed.
    dimension:
      type: categorical
  - name: assurance_scope
    description: all (whole report) or partial.
    dimension:
      type: categorical
  metrics:
  - name: dqs_avg
    label: Disclosure Quality Score, average
    description: The average Disclosure Quality Score of the group. Compare within one financial year only.
    type: simple
    agg: average
    expr: dqs_total
    config:
      meta:
        public_safe: true
        metric_type: average
        unit: points (0-100)
        direction: higher_better
        min_companies: 5
        companies_metric: companies_with_dqs
  - name: dqs_median
    label: Disclosure Quality Score, typical company
    description: The Disclosure Quality Score of the company in the middle of the group.
    type: simple
    agg: percentile
    percentile: 0.5
    expr: dqs_total
    config:
      meta:
        public_safe: true
        metric_type: median
        unit: points (0-100)
        direction: higher_better
        min_companies: 5
        companies_metric: companies_with_dqs
  - name: dqs_grade_a_share_num
    type: simple
    description: Building block (rows counted, x 100); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when (dqs_grade = 'A') and (dqs_grade <> 'insufficient_data') then 100.0 else 0 end
    config:
      meta:
        public_safe: false
        metric_type: input
  - name: dqs_grade_a_share_den
    type: simple
    description: Building block (rows in scope); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when dqs_grade <> 'insufficient_data' then 1 else 0 end
    config:
      meta:
        public_safe: false
        metric_type: input
  - name: dqs_grade_a_share
    label: Company-years graded A (%)
    description: Out of every 100 graded company reports, how many reach grade A (85 points or more).
    type: ratio
    numerator: dqs_grade_a_share_num
    denominator: dqs_grade_a_share_den
    config:
      meta:
        public_safe: true
        metric_type: share
        unit: '%'
        direction: higher_better
        min_companies: 5
        companies_metric: companies_with_dqs_grade
  - name: voluntary_depth_avg
    label: Voluntary depth, average
    description: On average, the share of the voluntary (Leadership) indicators that the companies of the group answered.
    type: simple
    agg: average
    expr: dqs_voluntary_depth
    config:
      meta:
        public_safe: true
        metric_type: average
        unit: share (0-1)
        direction: higher_better
        min_companies: 5
        companies_metric: companies_with_voluntary_depth
  - name: companies_with_dqs
    label: Companies with a Disclosure Quality Score
    description: How many companies of the group have a Disclosure Quality Score.
    type: simple
    agg: count_distinct
    expr: case when dqs_total is not null then isin end
    config:
      meta:
        public_safe: true
        metric_type: count_distinct
        unit: companies
        direction: context
  - name: companies_with_dqs_grade
    label: Companies with a Disclosure Quality grade
    description: How many companies of the group have a grade (at least three components scored).
    type: simple
    agg: count_distinct
    expr: case when nullif(dqs_grade, 'insufficient_data') is not null then isin end
    config:
      meta:
        public_safe: true
        metric_type: count_distinct
        unit: companies
        direction: context
  - name: companies_with_voluntary_depth
    label: Companies with a voluntary depth
    description: How many companies of the group have a voluntary depth figure.
    type: simple
    agg: count_distinct
    expr: case when dqs_voluntary_depth is not null then isin end
    config:
      meta:
        public_safe: true
        metric_type: count_distinct
        unit: companies
        direction: context
- name: sem_restatement
  description: Semantic model of the restatement tracker (view of fct_restatement, without the original and restated values). The financial year is the year the value belongs to, not the year of the report that restates it.
  semantic_model: true
  agg_time_dimension: fiscal_year_end
  primary_entity: restatement
  columns:
  - name: company_year_key
    description: Key of the company-year the restated value belongs to.
    entity:
      name: company_year
      type: foreign
    data_tests:
    - not_null
  - name: isin
    description: ISIN of the company.
    entity:
      name: company
      type: foreign
  - name: fiscal_year_end
    description: Last day of the financial year (31 March). The time dimension, by year.
    granularity: year
    dimension:
      type: time
    data_tests:
    - not_null
  - name: metric_id
    description: Catalogue metric that was compared.
    dimension:
      type: categorical
  - name: classification
    description: no_change, minor, material, suspected_scale_error, ...
    dimension:
      type: categorical
  - name: explained_by
    description: merger/demerger, boundary change, possible note or empty.
    dimension:
      type: categorical
  metrics:
  - name: material_restatements
    label: Material restatements
    description: How many figures were changed materially in the next year's report. A restatement is not wrongdoing.
    type: simple
    agg: sum
    expr: case when classification = 'material' then 1 else 0 end
    config:
      meta:
        public_safe: true
        metric_type: count
        unit: restated values
        direction: context
  - name: material_restatement_share_num
    type: simple
    description: Building block (rows counted, x 100); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when (classification = 'material') and (is_compared) then 100.0 else 0 end
    config:
      meta:
        public_safe: false
        metric_type: input
  - name: material_restatement_share_den
    type: simple
    description: Building block (rows in scope); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when is_compared then 1 else 0 end
    config:
      meta:
        public_safe: false
        metric_type: input
  - name: material_restatement_share
    label: Figures materially restated (%)
    description: Out of every 100 figures that could be compared with the next year's report, how many were changed materially.
    type: ratio
    numerator: material_restatement_share_num
    denominator: material_restatement_share_den
    config:
      meta:
        public_safe: true
        metric_type: share
        unit: '%'
        direction: lower_better
        min_companies: 5
        companies_metric: companies_with_compared_restatements
  - name: suspected_scale_errors
    label: Suspected scale errors
    description: 'How many figures are more than 100 times apart from the next year''s report: unit slips, not restatements.'
    type: simple
    agg: sum
    expr: case when classification = 'suspected_scale_error' then 1 else 0 end
    config:
      meta:
        public_safe: true
        metric_type: count
        unit: values
        direction: context
  - name: companies_with_compared_restatements
    label: Companies with compared figures
    description: How many companies of the group have at least one figure that could be compared with the next year's report.
    type: simple
    agg: count_distinct
    expr: case when nullif(is_compared, false) is not null then isin end
    config:
      meta:
        public_safe: true
        metric_type: count_distinct
        unit: companies
        direction: context
- name: sem_company
  description: 'Semantic model of the companies (view of dim_company): names, so that a metric can be shown per company. Query them as company__display_name and company__symbol.'
  semantic_model: true
  columns:
  - name: isin
    description: ISIN of the company.
    entity:
      name: company
      type: primary
    data_tests:
    - unique
    - not_null
  - name: display_name
    description: Short company name for charts.
    dimension:
      type: categorical
  - name: symbol
    description: Current NSE symbol.
    dimension:
      type: categorical
- name: time_spine_day
  description: Daily time spine required by MetricFlow (FY2020-21 to FY2026-27). The semantic layer itself only uses whole financial years.
  time_spine:
    standard_granularity_column: date_day
  columns:
  - name: date_day
    description: One row per calendar day.
    granularity: day
    data_tests:
    - unique
    - not_null
- name: rpt_public_group_metrics
  description: 'PUBLIC model (docs/publication_policy.md): the group figures of the semantic layer by group type, group and financial year, generated from the same definitions as the MetricFlow metrics. A statistic is empty when fewer than 5 companies stand behind it; counts are always shown; no sum of filed values is a column. Public tools (Streamlit, AI analyst, public Power BI) read this table, never the semantic layer.'
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - group_type
        - group_value
        - fiscal_year_label
  columns:
  - name: group_type
    description: 'Kind of group: all, sector_group, peer_group, ranking_group, size_band, ownership_type.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - all
          - sector_group
          - peer_group
          - ranking_group
          - size_band
          - ownership_type
  - name: group_value
    description: The group, e.g. Asset-heavy; 'All companies' for group_type all.
    data_tests:
    - not_null
  - name: fiscal_year_label
    description: Financial year, e.g. FY2025-26.
    data_tests:
    - not_null
  - name: ghg_intensity_agg
    description: 'GHG intensity, whole group: sum(ghg_s12_tco2e) / sum(turnover_cr) over the companies that have both. Empty when companies_with_ghg_intensity is below 5.'
  - name: ghg_intensity_median
    description: 'GHG intensity, typical company: median of ghg_intensity_tco2e_per_cr. Empty when companies_with_ghg_intensity is below 5.'
  - name: companies_with_ghg_intensity
    description: 'Companies with a ghg intensity: count of distinct companies with ghg_intensity_tco2e_per_cr.'
  - name: energy_intensity_agg
