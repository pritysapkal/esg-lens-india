  - name: water_intensity_agg_den
    type: simple
    description: Building block (denominator); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when water_consumption_kl is not null and turnover_cr <> 0 then turnover_cr end
    config:
      meta:
        public_safe: false
        metric_type: input
  - name: water_intensity_agg
    label: Water intensity, whole group
    description: 'All the water consumed of the group divided by all its turnover: the intensity of the group as if it were one company. Large companies weigh more.'
    type: ratio
    numerator: water_intensity_agg_num
    denominator: water_intensity_agg_den
    config:
      meta:
        public_safe: true
        metric_type: ratio_of_sums
        unit: kl per Rs crore
        direction: lower_better
        min_companies: 5
        companies_metric: companies_with_water_intensity
  - name: water_intensity_median
    label: Water intensity, typical company
    description: 'The intensity of the company in the middle of the group: half the companies are below it, half above. Every company weighs the same.'
    type: simple
    agg: percentile
    percentile: 0.5
    expr: water_intensity_kl_per_cr
    config:
      meta:
        public_safe: true
        metric_type: median
        unit: kl per Rs crore
        direction: lower_better
        min_companies: 5
        companies_metric: companies_with_water_intensity
  - name: companies_with_water_intensity
    label: Companies with a water intensity
    description: How many companies of the group have a water intensity. The whole-group and typical-company figures may be published only when this is 5 or more.
    type: simple
    agg: count_distinct
    expr: case when water_intensity_kl_per_cr is not null then isin end
    config:
      meta:
        public_safe: true
        metric_type: count_distinct
        unit: companies
        direction: context
  - name: waste_intensity_agg_num
    type: simple
    description: Building block (numerator); not a metric to read on its own.
    hidden: true
    agg: sum
    expr: case when waste_generated_t is not null and turnover_cr <> 0 then waste_generated_t end
    config:
      meta:
        public_safe: false
