  - name: suppressed_reason
    description: 'Why some figures of the row are empty: fewer_than_5_companies (a statistic whose companies count is below 5), not_yet_observable (restatement figures of a year with no later filing), or both joined by a bar. Empty when nothing is withheld.'
    data_tests:
    - accepted_values:
        arguments:
          values:
          - fewer_than_5_companies
          - not_yet_observable
          - fewer_than_5_companies|not_yet_observable
        config:
          where: suppressed_reason is not null
