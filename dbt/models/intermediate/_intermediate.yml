version: 2

# Intermediate layer: business rules (period roles, unit normalisation, scale corrections, metric
# mapping). Every rule is documented with evidence in docs/business_rules.md; every changed value
# keeps its original (raw_value / value_num) and says why (normalisation_flag, correction_reason).

models:
  - name: int_facts_with_context
    description: >
      One row per fact (numbers and short text) with its filing (company, fiscal year, taxonomy,
      main period), context (period dates, breakdown) and unit label attached.
    columns:
      - name: fact_id
        description: Unique ID of the fact.
        tests: [unique, not_null]
      - name: symbol
        description: NSE symbol of the company.
        tests: [not_null]
      - name: filing_period_start
        description: First day of the filing's main reporting period.
      - name: filing_period_end
        description: Last day of the filing's main reporting period.

  - name: int_period_role
    description: >
      Facts labelled with the period they belong to, relative to their filing - CY (the reporting
      year), PY (the comparative year), PY2 (second comparative), INSTANT_CY / INSTANT_PY (dates at
      the end of those years) or OTHER - and with the financial year of the VALUE. A PY value in
      the FY2025-26 filing belongs to FY2024-25. Works for 15-month and calendar-year filings
      because roles are anchored on the filing's own period.
    columns:
      - name: fact_id
        description: Unique ID of the fact.
        tests: [unique, not_null]
      - name: period_role
        description: CY, PY, PY2, INSTANT_CY, INSTANT_PY or OTHER (see model description).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [CY, PY, PY2, INSTANT_CY, INSTANT_PY, OTHER]
      - name: value_period_end
        description: Last day of the value's own period (end date, or the instant).
      - name: value_fiscal_year_label
        description: April-March financial year in which the value's period ends, e.g. FY2024-25.
        tests: [not_null]

  - name: int_turnover_corrected
    description: >
      Turnover per filing (current year) as filed and corrected. Values below 10^9 INR were filed in
      crore, million or lakh; the scale is chosen by comparing with the company's other plausible
      years. Plausible-looking values far from the other years are NOT changed but get a lower
      confidence so they show up for review.
    columns:
      - name: filing_id
        description: The filing.
        tests: [unique, not_null]
      - name: symbol
        description: NSE symbol of the company.
      - name: fiscal_year_label
        description: Financial year of the filing.
      - name: turnover_raw
        description: Turnover exactly as filed (as a number).
      - name: turnover_inr
        description: Turnover in rupees after the scale correction (= turnover_raw if not corrected).
        tests: [not_null]
      - name: scale_applied
        description: True when turnover_raw was multiplied by a scale (crore, million or lakh).
      - name: scale
        description: The multiplier used (1, 10^5, 10^6 or 10^7).
      - name: scale_name
        description: rupees, crore, million or lakh.
      - name: reference_inr
        description: Median of the company's other years that look plausible (>= 10^9 INR).
      - name: n_reference_years
        description: How many other years were used for reference_inr.
      - name: ratio_to_other_years
        description: turnover_inr / reference_inr (1 = in line with the other years).
      - name: evidence_ratio
        description: >
          (filed Scope 1+2) / turnover_raw / (filed Scope 1+2 intensity per rupee). About 10^7
          when the filer computed its intensity with turnover in rupees while reporting turnover
          in crore - supporting evidence for the crore reading.
      - name: correction_reason
        description: Why the value was corrected, with the evidence. Empty when not corrected.
      - name: confidence
        description: >
          high / medium / low. Corrected: how well the corrected value matches the other years
          (within 1.5x = high, 3x = medium). Not corrected: high unless far from the other years.
        tests:
          - accepted_values:
              arguments:
                values: [high, medium, low]

  - name: int_implied_units
    description: >
      The real unit of quantities that the 2021/2023 taxonomies file with unit "pure" (or as text),
      one row per filing and metric - from the next filing's matching comparative value, else from
      the companion "UnitOf..." text fact, else the BRSR format's default unit.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [filing_id, metric_id]
    columns:
      - name: implied_unit_label
        description: Unit label to use (a key of seeds/unit_normalisation.csv).
        tests: [not_null]
      - name: unit_source
        description: bridge_next_filing, text_unit or format_default.
        tests:
          - accepted_values:
              arguments:
                values: [bridge_next_filing, text_unit, format_default]
      - name: bridge_unit_label
        description: Unit of the matching PY value in the company's next filing (if any).
      - name: n_bridge_matches
        description: How many values matched within 5 % between the two filings.
      - name: text_unit_raw
        description: The free-text unit as filed in the companion UnitOf<concept> fact.
      - name: text_unit_label
        description: text_unit_raw mapped through seeds/text_unit_normalisation.csv.
      - name: unit_conflict
        description: True when the bridge and the text unit imply different multipliers (text wins).

  - name: int_values_normalised
    description: >
      Catalogue facts with values converted to the metric's standard unit. Keeps raw_value and
      value_num; percent values get value_pct; ISO durations become days; old-taxonomy units are
      inferred; turnover is scale-corrected. normalisation_flag lists everything that was inferred,
      corrected or unusual. NA text and zero stay as flags; a missing value is a missing row.
    columns:
      - name: fact_id
        description: Unique ID of the fact.
        tests: [unique, not_null]
      - name: metric_id
        description: Catalogue metric the fact feeds.
        tests: [not_null]
      - name: unit_label_effective
        description: Unit used for the conversion - the filed label, or the inferred one for old filings.
      - name: multiplier
        description: Factor from seeds/unit_normalisation.csv applied to the filed value.
      - name: value_std_auto
        description: >
          The value in unit_std after the automatic rules only (rounded to 15 significant digits
          to drop float noise).
      - name: override_id
        description: Approved manual override applied to this value (seeds/manual_overrides.csv), if any.
      - name: override_multiplier
        description: The override's multiplier, applied on top of value_std_auto.
      - name: value_std
        description: Final value in unit_std = value_std_auto x override_multiplier (if any).
      - name: value_pct
        description: >
          For percent metrics, the value in percent (0.2036 -> 20.36). Values filed above 1 are
          taken as already in percent and not multiplied again.
      - name: normalisation_flag
        description: >
          "|"-separated flags, e.g. pct_given_as_0_100, numeric_from_text, iso_duration_parsed,
          unit_bridged_from_next_filing, unit_from_text, unit_format_default,
          unit_conflict_text_vs_bridge, mtco2e_read_as_metric_tonnes, unit_grams_converted,
          unit_not_in_map, turnover_scale_corrected, manual_override. Empty = taken as filed.
      - name: correction_reason
        description: Why the value differs from the filed number by more than a unit conversion.

  - name: int_metric_values
    description: >
      The metric values: one row per catalogue value with its normalised value, the period it
      belongs to and its source filing. Only the breakdowns allowed for each metric are kept.
      This is the input for the marts.
    columns:
      - name: fact_id
        description: Unique ID of the source fact.
        tests: [unique, not_null]
      - name: symbol
        description: NSE symbol of the company.
        tests: [not_null]
      - name: isin
        description: ISIN of the company.
      - name: fiscal_year_label
        description: Financial year of the filing the value comes from.
        tests: [not_null]
      - name: value_fiscal_year_label
        description: >
          Financial year the value itself belongs to. Differs from fiscal_year_label for PY
          comparatives (the FY2025-26 filing's PY value belongs to FY2024-25).
        tests: [not_null]
      - name: period_role
        description: CY, PY, PY2, INSTANT_CY, INSTANT_PY or OTHER, relative to the source filing.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [CY, PY, PY2, INSTANT_CY, INSTANT_PY, OTHER]
      - name: metric_id
        description: Catalogue metric (see docs/metric_definitions.md).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('concept_metric_map')
                field: metric_id
      - name: role
        description: How the metric is used (headline, input, secondary, check_only, flag, quality, context).
      - name: dimension_key
        description: The breakdown, e.g. "EmployeesAndWorkersAxis=WorkersMember"; empty = company-wide.
        tests: [not_null]
      - name: value_std
        description: The final value in unit_std (after automatic rules and approved overrides).
      - name: value_std_auto
        description: The value after the automatic rules only, before any manual override.
      - name: override_id
        description: Approved manual override applied to this value, if any.
      - name: unit_std
        description: Standard unit of the metric.
      - name: value_pct
        description: Value in percent, for percent metrics.
      - name: value_text
        description: The answer as text, for text / enum metrics (e.g. "Standalone basis").
      - name: raw_value
        description: The value exactly as filed.
      - name: value_num
        description: The filed value as a number, before any conversion.
      - name: unit_label
        description: Unit label as filed.
      - name: is_nil
        description: True when the filer marked the value nil.
      - name: is_na_text
        description: True when the filed text means "not applicable / not available".
      - name: is_zero
        description: True when the filed number is exactly 0.
      - name: normalisation_flag
        description: See int_values_normalised.
      - name: correction_reason
        description: See int_values_normalised.
      - name: concept
        description: Concept as filed.
      - name: taxonomy_version
        description: Taxonomy version of the source filing.
      - name: value_period_end
        description: Last day of the value's own period.
      - name: filing_id
        description: Source filing.
        tests: [not_null]
      - name: is_latest_filing_for_value
        description: >
          True for the current-year value from the latest filing for that company and year - the
          value to report. PY values are comparatives (input for the restatement tracker).
      - name: is_comparative
        description: True for PY / PY2 / INSTANT_PY values.

  - name: int_mtco2e_check
    description: >
      Plausibility check of the rule "MtCO2e = metric tonnes", one row per filing with Scope 1/2 in
      MtCO2e: Scope 1+2 intensity per rupee crore vs the company's other years and its industry
      peers (at least 3). likely_megatonnes marks filings ~10^4-10^6 x below - reported, not corrected.
    columns:
      - name: filing_id
        description: The filing.
        tests: [unique, not_null]
      - name: intensity_tco2e_per_inr_cr
        description: Scope 1+2 (tCO2e) per rupee crore of corrected turnover.
      - name: company_other_years_median
        description: Median intensity of the same company in its other filings.
      - name: industry_peer_median
        description: Median intensity of other companies in the same NIFTY 50 industry and year (>= 3).
      - name: ratio_to_company
        description: intensity / company_other_years_median.
      - name: ratio_to_peers
        description: intensity / industry_peer_median.
      - name: is_implausible
        description: More than 100x away from either reference.
      - name: likely_megatonnes
        description: At least 10^4 x below a reference - the value was probably filed in megatonnes.

  - name: int_unmapped_concepts
    description: >
      Numeric concepts with values that are not in the metric catalogue, per taxonomy version -
      candidates for future metrics. For review, not errors.
    columns:
      - name: concept
        description: Concept as filed.
      - name: n_facts
        description: Number of values filed.
      - name: n_filings
        description: Number of filings with at least one value.
      - name: n_nonzero
        description: Number of values that are not 0.

  - name: int_normalisation_exceptions
    description: >
      Everything flagged, inferred or corrected, in one table for review - value flags, turnover
      scale decisions, MtCO2e plausibility findings and approved manual overrides (which will
      count against the Disclosure Quality Score).
    columns:
      - name: exception_type
        description: value_flag, turnover_scale, mtco2e_check or manual_override.
        tests:
          - accepted_values:
              arguments:
                values: [value_flag, turnover_scale, mtco2e_check, manual_override]
      - name: exception_code
        description: The specific flag or finding.
      - name: detail
        description: Plain-English explanation with the numbers.

  - name: int_company_names
    description: >
      One row per company (ISIN) and financial year: cleaned name, CIN and symbol(s), from the
      filing, the NSE listing and the facts NameOfTheCompany / CorporateIdentityNumber.
      Broken characters, bracketed abbreviations and ALL-CAPS variants are cleaned;
      placeholder CINs (e.g. the Z99999ZZ9999ZZZ999999 filed by SBIN) become empty and
      cin_filed keeps what was filed.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [isin, fiscal_year_label]
    columns:
      - name: isin
        tests: [not_null]
      - name: fiscal_year_label
        tests: [not_null]
      - name: company_name_clean
        description: Cleaned name, one consistent spelling per company and year.
        tests: [not_null]
      - name: cin
        description: Valid CIN as filed, or empty for banks / statutory bodies and placeholders.

  - name: int_company_nic
    description: >
      One row per filing and row of the "products or services sold" table: NIC code (digits only,
      approved corrections applied), 2-digit division, turnover share as filed, and which code is
      the primary one in the filing (highest share; ties -> lowest code).
    columns:
      - name: filing_id
        tests: [not_null]
      - name: turnover_share
        description: Share of total turnover as filed (fraction, 0.6738 = 67.38%).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: nic_division_2d
        description: First two digits of the code; empty when the code is unusable.
        tests:
          - relationships:
              arguments:
                to: ref('nic_sector_map')
                field: nic_division_2d

  - name: int_metric_values_enriched
    description: >
      int_metric_values with the company name and peer group (from dim_company) and whether the
      metric is material for that peer group (from metric_materiality). Same rows as
      int_metric_values.
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('int_metric_values')
    columns:
      - name: fact_id
        tests: [unique, not_null]
      - name: peer_group
        description: Peer group of the company; empty only if the company has none.
      - name: is_material
        description: true = ranked; false = shown, not ranked for this peer group.

  - name: int_yoy_anomalies
    description: >
      Company-years where turnover (annualised) or total headcount moves by more than 40% against
      the previous year in the data. explained_by = event, boundary change, both, or empty
      (unexplained, to be reviewed). Input for the Disclosure Quality Score consistency checks.
    columns:
      - name: symbol
        tests: [not_null]
      - name: fiscal_year_label
        tests: [not_null]
      - name: metric
        tests:
          - accepted_values:
              arguments:
                values: [turnover_inr, total_headcount]
      - name: prior
        description: Value in the previous year (turnover annualised).
      - name: current
        description: Value in this year (turnover annualised).
      - name: pct_change
        description: current / prior - 1, e.g. 0.55 = +55%.
        tests: [not_null]
      - name: explained_by
        description: event, boundary change, event + boundary change, or empty.
        tests:
          - accepted_values:
              arguments:
                values: [event, boundary change, event + boundary change]
              config:
                where: explained_by is not null

  - name: int_filing_revisions
    description: >
      One row per filing with its place among the filings of the same company and year. The newest
      filing (by revision date, else submission date) is the latest revision; gold uses it only.
    columns:
      - name: filing_id
        tests: [unique, not_null]
      - name: is_latest_revision
        description: true for the newest filing of the company-year.
        tests: [not_null]
      - name: has_revision_date
        description: true if the exchange lists a revision date for the filing.

  - name: int_company_year_assurers
    description: >
      One row per assurance / assessment provider named in a filing, spelling variants merged with
      the assurer_aliases seed. Feeds dim_assurer and bridge_company_year_assurer.
    columns:
      - name: assurer_key
        tests: [not_null]
      - name: assurer_name
        tests: [not_null]

  - name: int_scale_error_suspects
    description: >
      Current-year values that are more than 100 times (or less than a hundredth of) the comparative
      for the same year in the next report: a unit / scale mistake, not a restatement. Gold replaces
      these with the later comparative (fct_esg_value.best_value_std) and the restatement tracker
      excludes them. Filed intensities are not tested. Input for the Disclosure Quality Score.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [isin, metric_id, dimension_key, value_fiscal_year_label]
    columns:
      - name: isin
        tests: [not_null]
      - name: metric_id
        tests: [not_null]
      - name: value_fiscal_year_label
        description: Year the value belongs to.
        tests: [not_null]
      - name: original_value
        description: Value filed for the year in that year's report.
      - name: restated_value
        description: Comparative for the year in the next report.
      - name: ratio
        description: restated_value / original_value (above 100 or below 0.01).
        tests: [not_null]
      - name: unit_resolution_method
        description: How the unit of the original value was decided.

  - name: int_kpi_flags
    description: >
      One row per company-year and KPI flag raised in fct_company_year: implausible zeros set to
      empty, waste recovery above 100%, values replaced by the later comparative. Input for the
      Disclosure Quality Score.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [isin, fiscal_year_label, flag]
    columns:
      - name: isin
        tests: [not_null]
      - name: fiscal_year_label
        tests: [not_null]
      - name: flag
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - implausible_zero_female_wage_share
                  - implausible_zero_energy_total
                  - implausible_zero_water_withdrawal
                  - implausible_zero_headcount
                  - waste_recovery_over_100
                  - scale_error_values_replaced
      - name: detail
        description: What was found, in plain English.
        tests: [not_null]

unit_tests:
  - name: test_pure_to_pct
    description: Percent filed as a decimal is x100; a value already in percent is not scaled again.
    model: int_values_normalised
    given:
      - input: ref('int_period_role')
        rows:
          - {fact_id: f1, filing_id: F, taxonomy_version: "2026-02-28", concept: PercentageOfGrossWagesPaidToFemaleToTotalWagesPaid, unit_label: pure, value_num: 0.2036, has_dimensions: false, dimension_key: "", period_role: CY}
          - {fact_id: f2, filing_id: F, taxonomy_version: "2026-02-28", concept: PercentageOfGrossWagesPaidToFemaleToTotalWagesPaid, unit_label: pure, value_num: 20.36, has_dimensions: false, dimension_key: "", period_role: PY}
      - input: ref('concept_metric_map')
        rows:
          - {taxonomy_version: "2026-02-28", concept: PercentageOfGrossWagesPaidToFemaleToTotalWagesPaid, metric_id: female_wage_share_pct, unit_std: pct, value_kind: numeric, allowed_dimension_axes: ""}
      - input: ref('unit_normalisation')
        rows:
          - {unit_label_raw: pure, unit_std: pct, multiplier: 100}
      - input: ref('int_implied_units')
        rows: []
      - input: ref('int_turnover_corrected')
        rows: []
      - input: ref('manual_overrides')
        rows: []
    expect:
      rows:
        - {fact_id: f1, value_std: 20.36, value_pct: 20.36, normalisation_flag: ""}
        - {fact_id: f2, value_std: 20.36, value_pct: 20.36, normalisation_flag: pct_given_as_0_100}

  - name: test_per_rupee_to_per_crore
    description: 8.88e-8 tCO2e per rupee = 0.888 tCO2e per rupee crore.
    model: int_values_normalised
    given:
      - input: ref('int_period_role')
        rows:
          - {fact_id: f1, filing_id: F, taxonomy_version: "2026-02-28", concept: TotalScope1AndScope2EmissionsIntensityPerRupeeOfTurnover, unit_label: tCO2e/INR, value_num: 0.0000000888, has_dimensions: false, dimension_key: "", period_role: CY}
      - input: ref('concept_metric_map')
        rows:
          - {taxonomy_version: "2026-02-28", concept: TotalScope1AndScope2EmissionsIntensityPerRupeeOfTurnover, metric_id: ghg_intensity_filed_tco2e_per_inr_cr, unit_std: tCO2e/INR cr, value_kind: numeric, allowed_dimension_axes: ""}
      - input: ref('unit_normalisation')
        rows:
          - {unit_label_raw: tCO2e/INR, unit_std: tCO2e/INR cr, multiplier: 10000000}
      - input: ref('int_implied_units')
        rows: []
      - input: ref('int_turnover_corrected')
        rows: []
      - input: ref('manual_overrides')
        rows: []
    expect:
      rows:
        - {fact_id: f1, value_std: 0.888, unit_std: tCO2e/INR cr}

  - name: test_iso_duration_days
    description: Days payable filed as ISO 8601 'P59D' becomes 59 days.
    model: int_values_normalised
    given:
      - input: ref('int_period_role')
        rows:
          - {fact_id: f1, filing_id: F, taxonomy_version: "2026-02-28", concept: NumberOfDaysOfAccountsPayable, value_text: P59D, has_dimensions: false, dimension_key: "", period_role: CY}
      - input: ref('concept_metric_map')
        rows:
          - {taxonomy_version: "2026-02-28", concept: NumberOfDaysOfAccountsPayable, metric_id: days_payable, unit_std: days, value_kind: duration, allowed_dimension_axes: ""}
      - input: ref('unit_normalisation')
        rows:
          - {unit_label_raw: (none), unit_std: days, multiplier: 1}
      - input: ref('int_implied_units')
        rows: []
      - input: ref('int_turnover_corrected')
        rows: []
      - input: ref('manual_overrides')
        rows: []
    expect:
      rows:
        - {fact_id: f1, value_std: 59, normalisation_flag: iso_duration_parsed}

  - name: test_mtco2e_is_metric_tonnes
    description: MtCO2e is read as metric tonnes (x1) and flagged.
    model: int_values_normalised
    given:
      - input: ref('int_period_role')
        rows:
          - {fact_id: f1, filing_id: F, taxonomy_version: "2026-02-28", concept: TotalScope1Emissions, unit_label: MtCO2e, value_num: 91849.5, has_dimensions: false, dimension_key: "", period_role: CY}
      - input: ref('concept_metric_map')
        rows:
          - {taxonomy_version: "2026-02-28", concept: TotalScope1Emissions, metric_id: ghg_scope1_tco2e, unit_std: tCO2e, value_kind: numeric, allowed_dimension_axes: ""}
      - input: ref('unit_normalisation')
        rows:
          - {unit_label_raw: MtCO2e, unit_std: tCO2e, multiplier: 1}
      - input: ref('int_implied_units')
        rows: []
      - input: ref('int_turnover_corrected')
        rows: []
      - input: ref('manual_overrides')
        rows: []
    expect:
      rows:
        - {fact_id: f1, value_std: 91849.5, multiplier: 1, normalisation_flag: mtco2e_read_as_metric_tonnes}

  - name: test_manual_override_applied
    description: >
      An approved override multiplies the automatic value of that filing's metric (CY and PY);
      other filings and metrics are untouched. Original and automatic values are kept.
    model: int_values_normalised
    given:
      - input: ref('int_period_role')
        rows:
          - {fact_id: cy, filing_id: F24, taxonomy_version: "2026-02-28", concept: TotalScope1Emissions, unit_label: MtCO2e, value_num: 56, has_dimensions: false, dimension_key: "", period_role: CY}
          - {fact_id: py, filing_id: F24, taxonomy_version: "2026-02-28", concept: TotalScope1Emissions, unit_label: MtCO2e, value_num: 55, has_dimensions: false, dimension_key: "", period_role: PY}
          - {fact_id: other, filing_id: F25, taxonomy_version: "2026-02-28", concept: TotalScope1Emissions, unit_label: tCO2e, value_num: 61000000, has_dimensions: false, dimension_key: "", period_role: CY}
      - input: ref('concept_metric_map')
        rows:
          - {taxonomy_version: "2026-02-28", concept: TotalScope1Emissions, metric_id: ghg_scope1_tco2e, unit_std: tCO2e, value_kind: numeric, allowed_dimension_axes: ""}
