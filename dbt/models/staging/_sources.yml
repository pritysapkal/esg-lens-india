version: 2

# Where the data lives. ESG_DATA_DIR defaults to ../data (relative to dbt/, where dbt runs);
# CI points it at a synthetic dataset built from tests/fixtures (scripts/make_ci_data.py).
# dbt-duckdb reads the files directly via external_location ({name} = table name below).

sources:
  - name: brsr_raw
    description: >
      Tables written by the XBRL parser (ingestion/parse_xbrl.py) - one Parquet file per filing
      and table under data/processed/parsed/<table>/reporting_year_label=<label>/. Every value is
      kept exactly as filed (text); typing happens in the staging models.
    config:
      meta:
        external_location: >-
          read_parquet('{{ env_var('ESG_DATA_DIR', '../data') }}/processed/parsed/{name}/*/*.parquet',
          hive_partitioning = true)
    tables:
      - name: filings
        description: One row per parsed filing - counts and the main reporting period.
      - name: contexts
        description: >
          XBRL contexts - who (entity), when (period) and which slice (dimensions) a value is about.
      - name: units
        description: XBRL units, including ratio units built with xbrli:divide.
      - name: facts
        description: Numeric and short text facts, values as filed.
      - name: text_facts
        description: Long text facts (TextBlock concepts or values over 1,000 characters).

  - name: intake
    description: >
      Files from the manual intake pipeline (Module 1): the NSE BRSR listing, the intake manifest
      and the official NIFTY 50 constituents list. All read as text and typed in staging.
    tables:
      - name: listing
        description: NSE BRSR listing - one row per filing NSE lists (built by ingestion/discover.py).
        config:
          meta:
            external_location: >-
              read_parquet('{{ env_var('ESG_DATA_DIR', '../data') }}/processed/listing.parquet')
      - name: manifest
        description: >
          Intake manifest - one row per XBRL file received and filed into data/raw/xbrl
          (built by ingestion/intake.py).
        config:
          meta:
            external_location: >-
              read_csv('{{ env_var('ESG_DATA_DIR', '../data') }}/raw/manifest.csv',
              header = true, all_varchar = true)
      - name: universe
        description: Official NIFTY 50 constituents list from niftyindices.com, saved by hand.
        config:
          meta:
            external_location: >-
              read_csv('{{ env_var('ESG_DATA_DIR', '../data') }}/raw/reference/ind_nifty50list.csv',
              header = true, all_varchar = true, normalize_names = true)
