name: esg_lens
version: "0.1.0"
config-version: 2
profile: esg_lens

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  # required by dbt_date (dependency of dbt_expectations)
  "dbt_date:time_zone": "Asia/Kolkata"

models:
  esg_lens:
    staging:
      +materialized: view
    intermediate:
      +materialized: view # heavy models set materialized='table' in their config
    marts:
      +materialized: table
  elementary:
    +schema: elementary

seeds:
  esg_lens:
    concept_metric_map:
      +column_types:
        taxonomy_version: varchar # keep as text: it is a taxonomy label, not a reporting date
        concept: varchar
        metric_id: varchar
        metric_name: varchar
        brsr_core_attribute: varchar
        role: varchar
        allowed_dimension_axes: varchar
        unit_raw_expected: varchar
        unit_std: varchar
        direction: varchar
        value_kind: varchar
        notes: varchar
    unit_normalisation:
      +column_types:
        unit_label_raw: varchar
        unit_std: varchar
        multiplier: double
        note: varchar
    manual_overrides:
      +column_types:
        override_id: varchar
        symbol: varchar
        fiscal_year_label: varchar
        filing_id: varchar
        metric_id: varchar
        multiplier: double
        reason: varchar
        evidence: varchar
        approved_by: varchar
        approved_on: date
    text_unit_normalisation:
      +column_types:
        unit_text: varchar
        unit_label: varchar
        note: varchar
    nic_sector_map:
      +column_types:
        nic_division_2d: varchar # preserve leading zeros (05, 06, 07)
        nic_division_name: varchar
        nic_section: varchar
        expected_peer_group: varchar
        source: varchar
        verified_by: varchar
    nic_code_corrections:
      +column_types:
        symbol: varchar
        fiscal_year_label: varchar
        nic_code_raw: varchar # preserve leading zeros
        nic_code_corrected: varchar
        reason: varchar
        verified_by: varchar
    peer_groups:
      +column_types:
        symbol: varchar
        peer_group: varchar
        sector_group: varchar
        sub_industry: varchar
        peer_group_sort: integer
        sector_group_sort: integer
        assigned_by: varchar
    corporate_events:
      +column_types:
        isin: varchar
        symbol: varchar
        event_date: date
        event_type: varchar
        description: varchar
        affected_fiscal_year_label: varchar
        comparability_break: boolean
        source_note: varchar
        verified: boolean
    dim_fiscal_year:
      +column_types:
        fiscal_year_label: varchar
        fy_sort: integer
        start_date: date
        end_date: date
        is_brsr_core_year: boolean
        assurance_fields_available: boolean
        note: varchar
    metric_disclosure_requirement:
      +column_types:
        metric_id: varchar
        indicator_type: varchar
        mandatory_from_fy: varchar
        brsr_core: boolean
        note: varchar
    company_attributes:
      +column_types:
        symbol: varchar
        display_name: varchar
        ownership_type: varchar
        business_group: varchar
        source_note: varchar
        verified: boolean
    metric_materiality:
      +column_types:
        peer_group: varchar
        metric_id: varchar
        is_material: boolean
        reason: varchar
