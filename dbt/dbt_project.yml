name: esg_lens
version: "0.1.0"
config-version: 2
profile: esg_lens

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

vars:
  # required by dbt_date (dependency of dbt_expectations)
  "dbt_date:time_zone": "Asia/Kolkata"

models:
  esg_lens:
    staging:
      +materialized: view
    intermediate:
      +materialized: view # heavy models set materialized='table' in their config
    marts:
      +materialized: table
  elementary:
    +schema: elementary

seeds:
  esg_lens:
    concept_metric_map:
      +column_types:
        taxonomy_version: varchar # keep as text: it is a taxonomy label, not a reporting date
        concept: varchar
        metric_id: varchar
        metric_name: varchar
        brsr_core_attribute: varchar
        role: varchar
        allowed_dimension_axes: varchar
        unit_raw_expected: varchar
        unit_std: varchar
        direction: varchar
        value_kind: varchar
        notes: varchar
    unit_normalisation:
      +column_types:
        unit_label_raw: varchar
        unit_std: varchar
        multiplier: double
        note: varchar
    text_unit_normalisation:
      +column_types:
        unit_text: varchar
        unit_label: varchar
        note: varchar
    nic_sector_map:
      +column_types:
        nic_code: varchar # preserve leading zeros
        nic_section: varchar
        nic_division: varchar
        sector_name: varchar
