name: esg_lens
version: "0.1.0"
config-version: 2
profile: esg_lens

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - target
  - dbt_packages

# dbt also writes target/osi_document.json (Open Semantic Interchange, an export we do not use)
# and prints one notice per hidden metric left out of it. The hidden metrics are the numerators
# and denominators of the ratio metrics - sums of filed values that must stay hidden - so that
# notice is silenced; every other warning still shows.
#
# Partial parsing is switched off: with metrics attached to models (the dbt 1.12 semantic-layer
# spec) dbt 1.12.5 fails a partial re-parse with a false "dbt found two metrics with the name ..."
# error, for example when ESG_DATA_DIR is set in one run and not in the next. A full parse on
# every run costs about 20 seconds and is always right. RE-CHECK ON EVERY dbt UPGRADE: remove
# the flag, run `dbt parse` with and without ESG_DATA_DIR set, and drop it if the error is gone.
flags:
  partial_parse: false
  warn_error_options:
    silence:
      - MFConverterIssue

vars:
  # required by dbt_date (dependency of dbt_expectations)
  "dbt_date:time_zone": "Asia/Kolkata"

# Tags (see selectors.yml): core = the pipeline every report needs; quality = data-quality lists;
# restatement, benchmark, public, dqs = optional gold families built on top of core;
# semantic = the views and time spine of the semantic layer (MetricFlow), on top of gold.
models:
  esg_lens:
    staging:
      +materialized: view
      +tags: [core]
    intermediate:
      +materialized: view # heavy models set materialized='table' in their config
      +tags: [core]
      int_normalisation_exceptions:
        +tags: [quality]
      int_unmapped_concepts:
        +tags: [quality]
      int_mtco2e_check:
        +tags: [quality]
      int_yoy_anomalies:
        +tags: [quality]
      int_scale_error_suspects:
        +tags: [quality]
      int_kpi_flags:
        +tags: [quality]
      int_dqs_components: # reads the restatement tracker, so it is not part of the daily build
        +tags: [dqs]
      int_dqs_leadership_disclosure:
        +tags: [dqs]
      int_dqs_assurance:
        +tags: [dqs]
    marts:
      +materialized: table
      +tags: [core]
      fct_restatement:
        +tags: [restatement]
      rpt_restatement_summary:
        +tags: [restatement]
      rpt_public_restatement_summary:
        +tags: [restatement, public]
      rpt_public_concentration:
        +tags: [public]
      rpt_public_company_percentile:
        +tags: [benchmark, public]
      rpt_public_ghg_yoy:
        +tags: [public]
      fct_peer_benchmark:
        +tags: [benchmark]
      fct_company_kpi_percentile:
        +tags: [benchmark]
      rpt_public_company_year:
        +tags: [public]
      fct_disclosure_quality:
        +tags: [dqs]
      rpt_public_disclosure_quality:
        +tags: [dqs, public]
      rpt_public_group_metrics: # generated; reads the views of the semantic layer
        +tags: [semantic, public]
    semantic:
      +materialized: view
      +tags: [semantic]
      time_spine_day:
        +materialized: table
  elementary:
    +schema: elementary

seeds:
  esg_lens:
    +tags: [core]
    kpi_catalogue:
      +column_types:
        kpi_name: varchar
        label: varchar
        formula_text: varchar
        numerator: varchar
        denominator: varchar
        unit: varchar
        unit_type: varchar
        direction: varchar
        materiality_metric_id: varchar
        public_safe: boolean
        is_benchmarked: boolean
        definition_plain: varchar
        source_model: varchar
        metric_type: varchar
        companies_metric: varchar
    dqs_weights:
      +column_types:
        component: varchar
        weight: double
        description: varchar
    dqs_assurance_points:
      +column_types:
        item: varchar
        points: double
        description: varchar
    leadership_indicator_map:
      +column_types:
        taxonomy_version: varchar # a taxonomy label, not a date
        principle: varchar
        indicator: varchar
        indicator_seq: integer
        concept: varchar
        source: varchar
    known_kpi_exceptions:
      +column_types:
        isin: varchar
        symbol: varchar
        fiscal_year_label: varchar
        check_name: varchar
        value: double
        reason: varchar
        accepted_by: varchar
        accepted_on: date
    concept_metric_map:
      +column_types:
        taxonomy_version: varchar # keep as text: it is a taxonomy label, not a reporting date
        concept: varchar
        metric_id: varchar
        metric_name: varchar
        brsr_core_attribute: varchar
        role: varchar
        allowed_dimension_axes: varchar
        unit_raw_expected: varchar
        unit_std: varchar
        direction: varchar
        value_kind: varchar
        notes: varchar
    unit_normalisation:
      +column_types:
        unit_label_raw: varchar
        unit_std: varchar
        multiplier: double
        note: varchar
    manual_overrides:
      +column_types:
        override_id: varchar
        symbol: varchar
        fiscal_year_label: varchar
        filing_id: varchar
        metric_id: varchar
        multiplier: double
        reason: varchar
        evidence: varchar
        approved_by: varchar
        approved_on: date
    text_unit_normalisation:
      +column_types:
        unit_text: varchar
        unit_label: varchar
        note: varchar
    nic_sector_map:
      +column_types:
        nic_division_2d: varchar # preserve leading zeros (05, 06, 07)
        nic_division_name: varchar
        nic_section: varchar
        expected_peer_group: varchar
        source: varchar
        verified_by: varchar
    nic_code_corrections:
      +column_types:
        symbol: varchar
        fiscal_year_label: varchar
        nic_code_raw: varchar # preserve leading zeros
        nic_code_corrected: varchar
        reason: varchar
        verified_by: varchar
    peer_groups:
      +column_types:
        symbol: varchar
        peer_group: varchar
        sector_group: varchar
        sub_industry: varchar
        peer_group_sort: integer
        sector_group_sort: integer
        assigned_by: varchar
    corporate_events:
      +column_types:
        isin: varchar
        symbol: varchar
        event_date: date
        event_type: varchar
        description: varchar
        affected_fiscal_year_label: varchar
        comparability_break: boolean
        source_note: varchar
        verified: boolean
    dim_fiscal_year:
      +column_types:
        fiscal_year_label: varchar
        fy_sort: integer
        start_date: date
        end_date: date
        is_brsr_core_year: boolean
        assurance_fields_available: boolean
        note: varchar
    metric_disclosure_requirement:
      +column_types:
        metric_id: varchar
        indicator_type: varchar
        mandatory_from_fy: varchar
        brsr_core: boolean
        note: varchar
        verified: boolean
    company_attributes:
      +column_types:
        symbol: varchar
        display_name: varchar
        ownership_type: varchar
        business_group: varchar
        source_note: varchar
        verified: boolean
    metric_materiality:
      +column_types:
        peer_group: varchar
        metric_id: varchar
        is_material: boolean
        reason: varchar
