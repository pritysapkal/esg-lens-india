version: 2

seeds:
  - name: concept_metric_map
    description: >
      The metric catalogue: which SEBI BRSR concept feeds which metric, in each taxonomy version.
      Generated by scripts/build_metric_catalogue.py from docs/metric_shortlist.csv - a row exists
      only where the concept is defined in that version's taxonomy AND used in its filings.
      Renamed predecessors (e.g. TotalEnergyConsumption in the 2021/2023 taxonomies) map to the
      same metric_id as their successor.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [taxonomy_version, concept]
    columns:
      - name: taxonomy_version
        description: SEBI BRSR taxonomy version the row applies to, e.g. 2026-02-28.
        tests: [not_null]
      - name: concept
        description: Concept name as filed in that taxonomy version.
        tests: [not_null]
      - name: metric_id
        description: Our stable metric name (snake_case), the same across taxonomy versions.
        tests: [not_null]
      - name: metric_name
        description: Plain-English name of the metric.
      - name: brsr_core_attribute
        description: BRSR Core attribute or analysis area the metric belongs to (e.g. "1 GHG").
      - name: role
        description: >
          How the metric is used - headline (ranked/compared), input (feeds a computed metric),
          secondary, check_only (only to verify our own computation), flag (yes/no signal),
          quality (disclosure quality score) or context (e.g. sector).
        tests:
          - accepted_values:
              arguments:
                values: [headline, input, secondary, check_only, flag, quality, context]
      - name: allowed_dimension_axes
        description: >
          Breakdowns kept for the metric, separated by "|" (e.g. "GenderAxis|PermanentEmployeesAndWorkersAxis").
          Empty = only company-wide values.
      - name: unit_raw_expected
        description: Unit labels actually seen in the filings for this concept and version.
      - name: unit_std
        description: Unit after normalisation, e.g. tCO2e, GJ, kl, t, pct, count, "tCO2e/INR cr".
      - name: direction
        description: Whether lower or higher is better, or n/a / context when it is not a ranking metric.
        tests:
          - accepted_values:
              arguments:
                values: [lower_better, higher_better, n/a, context]
      - name: value_kind
        description: numeric, duration (ISO 8601, e.g. P59D), text, or enum (fixed list of answers).
        tests:
          - accepted_values:
              arguments:
                values: [numeric, duration, text, enum]
      - name: notes
        description: Renames, unit caveats and the analytics note from the shortlist.

  - name: unit_normalisation
    description: >
      How to convert each filed unit into the metric's standard unit. Keyed on the filed unit label
      AND unit_std, because "pure" means different things (percent x100, count x1). Rules and
      evidence in docs/business_rules.md.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [unit_label_raw, unit_std]
    columns:
      - name: unit_label_raw
        description: Unit label as filed (from stg_units), or a label inferred for old filings.
        tests: [not_null]
      - name: unit_std
        description: Standard unit of the metric.
        tests: [not_null]
      - name: multiplier
        description: Multiply the filed value by this to get the value in unit_std.
        tests: [not_null]
      - name: note
        description: Why, in plain English.

  - name: text_unit_normalisation
    description: >
      Free-text units from the 2021/2023 taxonomies (companion facts UnitOf<concept>, e.g.
      "Million tonnes of CO2 equivalent"), mapped to a unit label in unit_normalisation. Keys are
      lower case with whitespace collapsed.
    columns:
      - name: unit_text
        description: Normalised unit text as filed.
        tests: [unique, not_null]
      - name: unit_label
        description: The matching unit label in unit_normalisation.
        tests: [not_null]
      - name: note
        description: Comment on the mapping.

  - name: manual_overrides
    description: >
      Approved manual corrections for scale errors the automatic rules cannot fix (megatonnes
      filed as "MtCO2e", turnover filed 10-1000x too small). One row per filing and metric; the
      multiplier is applied to every value of that metric in that filing, after the automatic
      normalisation. Evidence and approval are recorded per row; see docs/business_rules.md.
    columns:
      - name: override_id
        description: Stable ID of the override, e.g. OVR-001.
        tests: [unique, not_null]
      - name: symbol
        description: NSE symbol of the company (must match the filing).
        tests: [not_null]
      - name: fiscal_year_label
        description: Financial year of the filing (must match the filing).
        tests: [not_null]
      - name: filing_id
        description: The filing whose values are corrected.
        tests: [not_null]
      - name: metric_id
        description: Catalogue metric to correct (turnover = turnover_inr).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('concept_metric_map')
                field: metric_id
      - name: multiplier
        description: Factor applied to the automatically normalised value (e.g. 1000000 for megatonnes).
        tests: [not_null]
      - name: reason
        description: Why the filed value is wrong, in plain English.
        tests: [not_null]
      - name: evidence
        description: The numbers that support the correction (company's other years, text units, peers).
        tests: [not_null]
      - name: approved_by
        description: Who approved the override.
        tests: [not_null]
      - name: approved_on
        description: Date of approval.
        tests: [not_null]

  - name: nic_sector_map
    description: >
      NIC-2008 2-digit divisions found in the BRSR filings, with their names (source: NIC-2008,
      MoSPI). expected_peer_group is an analyst hint used only to detect sector conflicts; it does
      not assign anything. verified_by is left empty until the name is checked by hand.
    columns:
      - name: nic_division_2d
        description: NIC-2008 division, two digits as text (leading zero kept).
        tests: [unique, not_null]
      - name: nic_division_name
        description: Division name in NIC-2008.
        tests: [not_null]
      - name: nic_section
        description: NIC-2008 section letter (A-U).
        tests: [not_null]
      - name: expected_peer_group
        description: Peer group a company mainly in this division would normally belong to.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: &peer_groups
                  - Financials
                  - IT services
                  - Energy & utilities
                  - Metals & mining
                  - Cement & construction
                  - Automobiles
                  - Consumer
                  - Healthcare
                  - Industrials & others
      - name: source
        description: Where the division name comes from.
      - name: verified_by
        description: Who checked the name against the MoSPI publication (empty = not yet).

  - name: nic_code_corrections
    description: >
      Fixes for NIC codes typed wrongly in filings (dropped leading zero, concatenated codes, the
      edition year typed as a code). One row per company, year and raw code. An empty
      nic_code_corrected means "not a usable code" (share counted as unclassified).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [symbol, fiscal_year_label, nic_code_raw]
    columns:
      - name: symbol
        tests: [not_null]
      - name: fiscal_year_label
        tests: [not_null]
      - name: nic_code_raw
        description: The code as filed, digits only.
        tests: [not_null]
      - name: nic_code_corrected
        description: Corrected code, or empty if the filed value is not a code.
      - name: reason
        description: Why, with the evidence from the filed description.
        tests: [not_null]
      - name: verified_by
        description: Who checked the correction by hand (empty = not yet).

  - name: peer_groups
    description: >
      Peer group of each company, by NSE symbol - exactly nine groups. Analyst assignment, edit
      here to move a company. WIPRO is not in the NIFTY 50 file but is covered.
    columns:
      - name: symbol
        description: NSE symbol (current).
        tests: [unique, not_null]
      - name: peer_group
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: *peer_groups
      - name: sector_group
        description: >
          Broader group used when a peer group is too small to rank: Financials, Asset-light or
          Asset-heavy.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Financials, Asset-light, Asset-heavy]
      - name: sub_industry
        description: >
          Financials: Banks, NBFC, Insurance or Market infrastructure. Others: the NSE industry
          (WIPRO is not in the NIFTY file; Information Technology is set by hand).
        tests: [not_null]
      - name: peer_group_sort
        description: Sort order of the peer group (for Power BI).
        tests: [not_null]
      - name: sector_group_sort
        description: Sort order of the sector group (for Power BI).
        tests: [not_null]
      - name: assigned_by
        description: Source of the assignment.

  - name: metric_materiality
    description: >
      Whether a metric is material (ranked) for a peer group. Not material = shown, not ranked.
      Rule: energy, water and waste metrics and GHG intensity are not material for Financials and
      IT services; everything else is material. Edit the CSV to change it.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [peer_group, metric_id]
    columns:
      - name: peer_group
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: *peer_groups
      - name: metric_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('concept_metric_map')
                field: metric_id
      - name: is_material
        tests: [not_null]
      - name: reason
        tests: [not_null]

  - name: corporate_events
    description: >
      Mergers, demergers, renames and acquisitions that break the comparability of a company
      numbers between years. Pre-filled from the analyst brief; verified is false until checked
      against company announcements. Only events in this table are flagged; nothing is inferred.
    columns:
      - name: isin
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_company')
                field: isin
              config:
                tags: [realdata] # events are about real companies, absent from the synthetic data
      - name: symbol
        tests: [not_null]
      - name: event_date
        description: Effective date; empty where the brief did not give one.
      - name: event_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [merger, demerger, rename, acquisition]
      - name: description
        tests: [not_null]
      - name: affected_fiscal_year_label
        description: First financial year in which the event shows in the numbers.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fiscal_year')
                field: fiscal_year_label
      - name: comparability_break
        description: true if values are not comparable with the previous year.
        tests: [not_null]
      - name: source_note
        description: Where the event comes from and what is missing.
      - name: verified
        tests: [not_null]

  - name: dim_fiscal_year
    description: Financial years in the data (April-March) with regulatory flags.
    columns:
      - name: fiscal_year_label
        tests: [unique, not_null]
      - name: fy_sort
        description: 1 = oldest year.
        tests: [unique, not_null]
      - name: start_date
        tests: [not_null]
      - name: end_date
        tests: [not_null]
      - name: is_brsr_core_year
        description: true from FY2023-24 (BRSR Core in force).
      - name: assurance_fields_available
        description: true from FY2024-25 (assurance fields in the taxonomy).
      - name: note
        description: What is new in that year.

  - name: metric_disclosure_requirement
    description: >
      Whether a metric MUST be disclosed, from which year (completeness input for the Disclosure
      Quality Score). Different from metric_materiality, which says whether to RANK it.
    columns:
      - name: metric_id
        tests: [unique, not_null]
      - name: indicator_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [essential, leadership]
      - name: mandatory_from_fy
        description: First year of mandatory disclosure; empty for voluntary (leadership) metrics.
      - name: brsr_core
        tests: [not_null]
      - name: note
        description: Why.
      - name: verified
        description: true once checked by the project owner (2026-10-10).
        tests: [not_null]

  - name: company_attributes
    description: >
      Display name, ownership and business group per symbol. Pre-filled from the analyst brief;
      verified is false until checked by hand.
    tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('peer_groups')
    columns:
      - name: symbol
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('peer_groups')
                field: symbol
      - name: display_name
        tests: [not_null]
      - name: ownership_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Government, Private Indian, MNC subsidiary]
      - name: business_group
        tests: [not_null]
      - name: source_note
        description: Basis of the assignment and any doubt.
      - name: verified
        tests: [not_null]
