name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: pytest -q

      - name: dbt deps + parse (DuckDB)
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt parse --profiles-dir .

  # dbt staging + intermediate (with seeds and unit tests) on a tiny synthetic dataset built
  # from tests/fixtures (CI has no real NSE data).
  # Tests tagged `realdata` (exact HDFC / NESTLE values, full row counts) are excluded here.
  dbt-staging-synthetic:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - name: Set data paths
        run: |
          echo "ESG_DATA_DIR=$RUNNER_TEMP/esg_data" >> "$GITHUB_ENV"
          echo "DUCKDB_PATH=$RUNNER_TEMP/esg_data/ci.duckdb" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build synthetic data
        run: python scripts/make_ci_data.py "$ESG_DATA_DIR"

      - name: dbt build staging + intermediate (synthetic)
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt build --profiles-dir . --select "staging +intermediate" --exclude tag:realdata
