[project]
name = "esg-lens-india"
version = "0.1.0"
description = "Open ESG analytics on SEBI BRSR XBRL filings of NIFTY 50 companies."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Dependencies are pinned in requirements.txt / requirements-dev.txt (not installed as a package).

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["dbt/dbt_packages", "dbt/target", "notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
# Excel formulas and sheet text are long strings; splitting them hurts more than it helps.
"scripts/build_excel.py" = ["E501"]
"scripts/build_powerbi.py" = ["E501"]
"scripts/reconcile_bi.py" = ["E501"]
"tests/test_bi.py" = ["E501"]
# Streamlit pages, the AI analyst and its eval: long plain-English strings and tool schemas
"app/**/*.py" = ["E501"]
"scripts/eval_ai_analyst.py" = ["E501"]
"tests/test_app.py" = ["E501"]
"tests/test_ai_analyst.py" = ["E501"]
"tests/test_orchestration.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "realdata: needs manually downloaded NSE files under data/raw (skipped when absent)",
]
