# Install once per clone:  pre-commit install
# Run on everything:        pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
        exclude: ^dbt/(models|snapshots)/.*\.yml$  # dbt yml may contain jinja
      - id: check-added-large-files
        args: [--maxkb=5000]
        exclude: ^fixtures/xbrl/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10 # keep in step with ruff in requirements-dev.txt
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0 # keep in step with sqlfluff in requirements-dev.txt
    hooks:
      - id: sqlfluff-lint
        files: ^dbt/(models|snapshots|analyses|macros)/.*\.sql$
      - id: sqlfluff-fix
        files: ^dbt/(models|snapshots|analyses|macros)/.*\.sql$
