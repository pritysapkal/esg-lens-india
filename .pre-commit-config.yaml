# Install once per clone:  pre-commit install
# Run on everything:        pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/  # fixtures reproduce NSE files byte-for-byte
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^tests/fixtures/
      - id: check-yaml
        exclude: ^dbt/(models|snapshots)/.*\.yml$  # dbt yml may contain jinja
      - id: check-added-large-files
        args: [--maxkb=5000]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10 # keep in step with ruff in requirements-dev.txt
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.4.0 # keep in step with sqlfluff in requirements-dev.txt
    hooks:
      # lint only: `sqlfluff fix` once silently dropped a VALUES column alias (week 5), so fixes
      # are run by hand and reviewed:  sqlfluff fix <path>
      - id: sqlfluff-lint
        files: ^dbt/(models|snapshots|analyses|macros|tests)/.*\.sql$

  - repo: local
    hooks:
      - id: strip-notebook-outputs # notebooks show real NSE-derived data; never commit outputs
        name: strip notebook outputs
        entry: python scripts/strip_notebook_outputs.py
        language: system # stdlib-only script; uses the active (venv) python
        files: \.ipynb$
