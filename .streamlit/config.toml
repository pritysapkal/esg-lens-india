# Streamlit settings for the public report card (app/streamlit_app.py).
[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1f7a6d"
backgroundColor = "#fafaf7"
secondaryBackgroundColor = "#eef2ef"
textColor = "#1f2a28"
font = "sans serif"

[client]
# visitors see no developer menu (Deploy, rerun settings)
toolbarMode = "viewer"
